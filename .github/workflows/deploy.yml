name: Deploy claude branch → master

on:
  push:
    branches:
      - 'claude/**'

env:
  SUPABASE_PROJECT_REF: jajlmmdsjlvzgcxiiypk

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge branch into master and push
        run: |
          BRANCH="${{ github.ref_name }}"
          git checkout master
          git merge "origin/$BRANCH" --no-ff -m "deploy: $BRANCH → master [$(date -u '+%Y-%m-%dT%H:%M:%SZ')]"

          # Rimuove i vecchi workflow PR/merge se ancora presenti
          CHANGED=0
          for F in .github/workflows/auto-pr-claude.yml .github/workflows/auto-merge-claude.yml; do
            if [ -f "$F" ]; then
              git rm "$F"
              CHANGED=1
            fi
          done
          if [ "$CHANGED" = "1" ]; then
            git commit -m "chore: rimuove vecchi workflow auto-pr e auto-merge"
          fi

          git push origin master

      - name: Check what changed
        id: check_changes
        run: |
          FILES=$(git diff HEAD~1 HEAD --name-only)
          if echo "$FILES" | grep -q '^supabase/functions/'; then
            echo "functions=true" >> $GITHUB_OUTPUT
          else
            echo "functions=false" >> $GITHUB_OUTPUT
          fi
          if echo "$FILES" | grep -q '^supabase/migrations/'; then
            echo "migrations=true" >> $GITHUB_OUTPUT
          else
            echo "migrations=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.check_changes.outputs.functions == 'true' || steps.check_changes.outputs.migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase link` non si usa più. Fra le altre cose chiama
      # GET /v1/projects/{ref}/api-keys, e dal 7 agosto 2026 quell'endpoint risponde con
      # un errore di validazione del suo stesso schema (SchemaError su inserted_at):
      # link muore lì e si porta dietro migration e Edge Function, che con le API keys
      # non c'entrano niente. Di link ci servivano solo i due file che scrive in
      # supabase/.temp — il project ref e l'URL del pooler — e quelli li scriviamo qui.
      # La password del database non serve: con il pooler configurato e nessuna
      # DB_PASSWORD, la CLI si crea da sola un ruolo di login temporaneo via API.
      - name: Prepare Supabase connection
        if: steps.check_changes.outputs.functions == 'true' || steps.check_changes.outputs.migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p supabase/.temp
          printf '%s' "$SUPABASE_PROJECT_REF" > supabase/.temp/project-ref
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" \
            > /tmp/pooler.json
          python3 - <<'PY' > supabase/.temp/pooler-url
          import json
          rows = json.load(open('/tmp/pooler.json'))
          if isinstance(rows, dict):
              rows = [rows]
          primary = next(r for r in rows if str(r.get('database_type', '')).upper() == 'PRIMARY')
          conn = primary['connection_string']
          # Le migration vogliono la session mode: in transaction mode (porta 6543) il
          # pooler non regge le transazioni multi-statement di `db push`.
          if str(primary.get('pool_mode', '')).lower() != 'session':
              conn = conn.replace(':6543/', ':5432/')
          print(conn, end='')
          PY
          echo "  → project ref e URL del pooler pronti (niente supabase link)"

      - name: Apply Supabase migrations
        if: steps.check_changes.outputs.migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "▶ Applying database migrations..."

          # Crea placeholder locali per migration presenti su remote ma assenti in locale.
          # Senza questi file, supabase db push fallisce con "Remote migration versions not found".
          supabase migration list --linked 2>&1 | grep -oE '[0-9]{14}' | sort -u | while read ver; do
            if ! compgen -G "supabase/migrations/${ver}_*.sql" > /dev/null 2>&1; then
              echo "-- Placeholder: migration $ver applicata direttamente su Supabase." \
                > "supabase/migrations/${ver}_remote_placeholder.sql"
              echo "  → Placeholder creato per versione $ver"
            fi
          done

          supabase db push --linked

      - name: Deploy Supabase Edge Functions
        if: steps.check_changes.outputs.functions == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for FN in $(git diff HEAD~1 HEAD --name-only | grep '^supabase/functions/' | awk -F/ '{print $3}' | sort -u); do
            echo "▶ Deploy edge function: $FN"
            EXTRA=""
            if grep -q "verify_jwt = false" "supabase/functions/$FN/config.toml" 2>/dev/null; then
              EXTRA="--no-verify-jwt"
              echo "   ↳ verify_jwt=false → aggiunto --no-verify-jwt"
            fi
            supabase functions deploy "$FN" --project-ref "$SUPABASE_PROJECT_REF" $EXTRA
          done
