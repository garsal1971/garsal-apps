name: Build Tandem APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'android-app/tandem/**'
      - '.github/workflows/build-tandem.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort | tail -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" 2>&1 || true
          fi

      # ⚠️ La stessa firma degli altri APK della repo: un pacchetto firmato con
      # una chiave diversa NON si installa sopra al precedente, e chi ce l'ha già
      # dovrebbe disinstallare (perdendo il token del viaggio, che sta solo lì).
      - name: Prepara keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android-app/tandem/garsal.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                  >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"            >> $GITHUB_ENV
            echo "✅ Keystore dai secrets — build release con firma fissa"
          else
            echo "⚠️  KEYSTORE_BASE64 non configurato — impossibile firmare in modo stabile"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x android-app/tandem/gradlew

      - name: Build Tandem release APK
        working-directory: android-app/tandem
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android-app/tandem/garsal.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tandem-release
          path: android-app/tandem/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ⚠️ Il push su master va rifatto se master si muove sotto i piedi: dallo
      # stesso commit possono partire più build Android, e la prima che arriva
      # sposta master lasciando alle altre un "cannot lock ref" con l'APK già
      # compilato e buttato via.
      - name: Pubblica APK su master (scaricabile via Netlify)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(grep versionName android-app/tandem/app/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -1)
          VERSION_CODE=$(grep versionCode android-app/tandem/app/build.gradle | grep -o '[0-9]\+' | head -1)
          cp android-app/tandem/app/build/outputs/apk/release/app-release.apk /tmp/Tandem-latest.apk

          # ── La scheda della build ─────────────────────────────────────────
          # Il nome del pacchetto è fisso (`Tandem-latest.apk`), quindi da fuori
          # una build vale l'altra: senza questa scheda né ⚙️ → 📱 Versione app
          # dentro l'APK né il pannello di comandi.html possono dire *quale*
          # versione si sta per scaricare.
          # ⚠️ Stesse sette chiavi delle schede di AppSphere, Smart Blocker e SOS:
          # le leggono `Aggiornamento.kt` e `mostraVersione()` in comandi.html.
          BYTES=$(stat -c%s /tmp/Tandem-latest.apk)
          SHA=$(sha256sum /tmp/Tandem-latest.apk | cut -d' ' -f1)
          cat > /tmp/Tandem-latest.json <<EOF
          {
            "app": "Tandem",
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$GITHUB_SHA",
            "bytes": $BYTES,
            "sha256": "$SHA"
          }
          EOF
          cat /tmp/Tandem-latest.json

          for i in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            git reset --hard origin/master

            mkdir -p releases
            cp /tmp/Tandem-latest.apk releases/Tandem-latest.apk

            # ⚠️ La scheda si aggiorna solo se si aggiorna l'APK: `builtAt`
            # cambia a ogni run, e commetterla da sola annuncerebbe una build
            # nuova per un pacchetto identico a quello di prima.
            git add releases/Tandem-latest.apk
            if git diff --staged --quiet && [ -f releases/Tandem-latest.json ]; then
              echo "APK non cambiato, skip commit"
              exit 0
            fi

            cp /tmp/Tandem-latest.json releases/Tandem-latest.json
            git add releases/Tandem-latest.json

            git commit -m "chore: aggiorna APK Tandem v${VERSION} [skip actions]"
            if git push origin master; then
              echo "✅ pubblicato al tentativo $i"
              exit 0
            fi

            echo "⚠️  master si è mosso, riprovo ($i/5)"
            sleep $((i * 5))
          done

          echo "❌ master continua a muoversi: APK non pubblicato"
          exit 1
