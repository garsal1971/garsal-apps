name: Build SOS APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'android-app/sos/**'
      - 'android-app/settings.gradle'
      - 'android-app/build.gradle'
      - '.github/workflows/build-sos.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort | tail -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" 2>&1 || true
          fi

      - name: Prepara keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android-app/garsal.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                  >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"            >> $GITHUB_ENV
            echo "✅ Keystore dai secrets — build release con firma fissa"
          else
            echo "⚠️  KEYSTORE_BASE64 non configurato — impossibile firmare in modo stabile"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build SOS release APK
        working-directory: android-app
        run: |
          ./gradlew :sos:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android-app/garsal.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sos-release
          path: android-app/sos/build/outputs/apk/release/sos-release.apk
          retention-days: 30

      # ⚠️ Il push su master va rifatto se master si muove sotto i piedi.
      # Le build Android della repo scattano insieme (toccare settings.gradle le
      # sveglia tutte) e finiscono a pochi secondi l'una dall'altra: la prima che
      # arriva sposta master e le altre si prendono un "cannot lock ref", con
      # l'APK già compilato e buttato via. Si rilegge master e si riprova.
      - name: Pubblica APK su master (scaricabile via Netlify)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(grep versionName android-app/sos/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -1)
          cp android-app/sos/build/outputs/apk/release/sos-release.apk /tmp/Sos-latest.apk

          for i in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            git reset --hard origin/master

            mkdir -p releases
            cp /tmp/Sos-latest.apk releases/Sos-latest.apk
            git add releases/Sos-latest.apk

            if git diff --staged --quiet; then
              echo "APK non cambiato, skip commit"
              exit 0
            fi

            git commit -m "chore: aggiorna APK SOS v${VERSION} [skip actions]"
            if git push origin master; then
              echo "✅ pubblicato al tentativo $i"
              exit 0
            fi

            echo "⚠️  master si è mosso, riprovo ($i/5)"
            sleep $((i * 5))
          done

          echo "❌ master continua a muoversi: APK non pubblicato"
          exit 1
