<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   CALORIE — il diario alimentare, e quante calorie servono davvero.

   Non decide niente sull'obiettivo: quello sta in «Ti pisasti?»
   (ps_objectives + le sue milestone) e qui si legge. Il target del
   giorno è la conseguenza di tre cose:

     basale (Mifflin-St Jeor su età, altezza, peso, sesso)
       × fattore di attività  =  quanto si consuma stando in piedi
       − deficit                                        = target

   ⚠️ IL DEFICIT È LA SOMMA DI DUE ADDENDI, e la separazione è la
   funzionalità, non un dettaglio:

     1. il RITMO DEL TRATTO di piano in cui si è oggi. I traguardi
        di un obiettivo non sono equidistanti: chi ne mette tre nel
        primo mese e uno nei due successivi vuole perdere in fretta
        e poi tenere. Spalmare la perdita residua su tutto il tempo
        residuo dà lo stesso numero nei due tratti, e fa restare
        indietro proprio dove il piano correva;
     2. il RECUPERO dello scarto già accumulato, spalmato sui giorni
        che restano IN TUTTO, non su quelli del tratto. È l'addendo
        che stringe il target da sé quando si è indietro e lo allarga
        quando si è avanti. Nel solo tratto in corso sarebbe feroce a
        ridosso di un traguardo: due chili in cinque giorni non sono
        un obiettivo.

   Senza il primo il piano non si sente, senza il secondo non ci si
   accorge di essere rimasti indietro.

   ⚠️ Il target di una giornata si CONGELA in al_days la prima volta
   che si segna qualcosa. Spostare un traguardo domani non deve
   riscrivere il giudizio su un giorno già passato: è la stessa
   scelta di ps_weight_tracking.target_weight.
   ═══════════════════════════════════════════════════════════════ */

var APP_VERSION = 'v1.5.0';
var BUILD_TIME  = '2026-08-27T09:00:00Z';
console.log('%c CALORIE ' + APP_VERSION + ' %c build: ' + BUILD_TIME,
    'background:#16a34a;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px 0 0 3px',
    'background:#222;color:#aaa;padding:2px 6px;border-radius:0 3px 3px 0');

const SUPABASE_URL = 'https://jajlmmdsjlvzgcxiiypk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphamxtbWRzamx2emdjeGlpeXBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTU0NjYsImV4cCI6MjA4NTUzMTQ2Nn0.ikaipwxOvIn43epayQ4mSZQkXtin3aaGEPouafwJFxU';

/* Un chilo di grasso corporeo vale circa 7700 kcal: è la costante che trasforma
   «mi mancano 4 kg in 90 giorni» in «devo togliere 342 kcal al giorno». È una
   stima, non una legge fisica — vale come ordine di grandezza, ed è la ragione
   per cui la pagina mostra sempre gli ingredienti del conto e non solo il totale. */
const KCAL_PER_KG = 7700;

/* ⚠️ Queste soglie NON tagliano più niente: il target è quello che il piano
   richiede, per basso che sia. Servono solo a far comparire un avviso, perché
   un numero molto basso vuol dire quasi sempre che i traguardi sono troppo
   ravvicinati — ma la decisione resta di chi guarda, non della pagina.
   Fino alla v1.1.0 erano un pavimento vero e il target ci si fermava sopra. */
const KCAL_ATTENZIONE = { M: 1500, F: 1200 };

/* cm_profile ammette anche `sesso = 'Altro'`, che Mifflin-St Jeor non prevede: le sue due
   varianti differiscono di una costante (+5 contro −161), quindi lì si usa la via di mezzo e la
   pagina lo scrive nella spiegazione del target. Fermare il conto sarebbe la scelta pulita e
   inservibile — l'app non calcolerebbe più niente per un campo che non cambia l'ordine di
   grandezza del risultato. La soglia di avviso in quel caso è la più alta delle due, che è il
   verso prudente: un avviso che compare prima non fa danni, uno che compare dopo sì. */
const CORREZIONE_SESSO = { M: 5, F: -161 };
const correzioneSesso = sesso => CORREZIONE_SESSO[sesso] ?? (5 + -161) / 2;
const sogliaAvviso = sesso => KCAL_ATTENZIONE[sesso] ?? 1500;

/* I sei momenti della giornata in cui si può mangiare, in ordine di orario.

   ⚠️ Gli `id` sono FISSI e non si inventano: `al_log.meal` ha un CHECK con esattamente questi
   sei valori, e una riga con un id diverso verrebbe rifiutata dal database. Quello che si
   configura è QUALI dei sei si usano e COME si chiamano — che è «quanti pasti al giorno» —
   non l'insieme dei valori possibili. Per averne un settimo serve una migration.

   `oraFino` serve solo a proporre il pasto giusto in base all'ora, e resta legato allo slot:
   rinominare «Merenda» in «Aperitivo» non sposta l'ora in cui si propone da sé. */
const PASTI_BASE = [
  { id: 'colazione',           label: '🌅 Colazione',   oraFino: 10 },
  { id: 'spuntino_mattina',    label: '🍎 Spuntino',    oraFino: 12 },
  { id: 'pranzo',              label: '🍝 Pranzo',      oraFino: 15 },
  { id: 'spuntino_pomeriggio', label: '☕ Merenda',     oraFino: 18 },
  { id: 'cena',                label: '🌙 Cena',        oraFino: 22 },
  { id: 'fuori_pasto',         label: '🍫 Fuori pasto', oraFino: 24 },
];

// La chiave in cm_settings, la tabella chiave/valore della suite: così la configurazione dei
// pasti è la stessa dal PC e dal telefono. In localStorage sarebbe di quel browser e basta.
const CHIAVE_PASTI = 'al_pasti';

const pastoBase = id => PASTI_BASE.find(p => p.id === id) || null;

/* I pasti configurati, in ordine di orario. `S.pasti` è l'elenco degli id attivi con l'etichetta
   scelta; se non è mai stato configurato valgono tutti e sei. */
function pastiAttivi() {
  if (!S.pasti || !S.pasti.length) return PASTI_BASE.slice();
  return PASTI_BASE
    .filter(b => S.pasti.some(p => p.id === b.id))
    .map(b => ({ ...b, label: (S.pasti.find(p => p.id === b.id).label || '').trim() || b.label }));
}

/* I pasti da disegnare per un giorno: quelli attivi, PIÙ quelli spenti che però quel giorno
   hanno delle righe. ⚠️ Spegnere un pasto non cancella quel che ci si era segnato dentro: le
   righe restano e si vedono, marcate come pasto tolto — è la stessa regola della misura tolta
   nei diari di Memo. Farle sparire vorrebbe dire calorie contate nel totale ma invisibili. */
function pastiDelGiorno(giorno) {
  const attivi = pastiAttivi();
  const usati = new Set(righeDelGiorno(giorno).map(r => r.meal));
  const spentiUsati = PASTI_BASE
    .filter(b => usati.has(b.id) && !attivi.some(a => a.id === b.id))
    .map(b => ({ ...b, tolto: true }));
  return PASTI_BASE
    .map(b => attivi.find(a => a.id === b.id) || spentiUsati.find(x => x.id === b.id))
    .filter(Boolean);
}

/* ── Supabase REST ──────────────────────────────────────────── */
const tok = () => S.session?.access_token || SUPABASE_ANON_KEY;
// L'id dell'utente serve agli upsert: PostgREST vuole nel payload le colonne su cui fa
// ON CONFLICT. Se la sessione non ce l'ha, la chiave sparisce da JSON.stringify e resta il
// DEFAULT auth.uid() della colonna — che è comunque lo stesso valore.
const uid = () => S.session?.user?.id || undefined;
function sbH(extra = {}) {
  return { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${tok()}`, 'Content-Type': 'application/json', ...extra };
}
async function sbQ(table, params = '') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: sbH() });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json();
}
async function sbIns(table, body, extraHeaders = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST', headers: sbH({ 'Prefer': 'return=representation', ...extraHeaders }), body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json().catch(() => []);
}
async function sbUpd(table, filter, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH', headers: sbH({ 'Prefer': 'return=representation' }), body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json();
}
async function sbDel(table, filter) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, { method: 'DELETE', headers: sbH() });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
}

/* ── Sessione ───────────────────────────────────────────────── */
const loadSession = () => { try { return JSON.parse(localStorage.getItem('garsal_session')); } catch { return null; } };
async function initFromSbToken(token) {
  try {
    const user = await (await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` },
    })).json();
    if (user?.id) return { access_token: token, refresh_token: null, expires_at: Date.now() + 3600_000, user };
  } catch {}
  return null;
}
async function refreshSession(session) {
  if (!session?.refresh_token) return null;
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!r.ok) return null;
    const d = await r.json();
    const ns = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + d.expires_in * 1000, user: d.user };
    localStorage.setItem('garsal_session', JSON.stringify(ns));
    return ns;
  } catch { return null; }
}

/* ── Formattazione e date ───────────────────────────────────── */
const $ = id => document.getElementById(id);
const setHtml = (id, h) => { const el = $(id); if (el) el.innerHTML = h; };
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const num = n => (n == null || isNaN(n)) ? null : +n;
const fmtKcal = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('it-IT');
const fmtG = n => (n == null || isNaN(n)) ? '—' : (Math.round(n * 10) / 10).toLocaleString('it-IT');
const fmtKg = n => (n == null || isNaN(n)) ? '—' : (Math.round(n * 10) / 10).toLocaleString('it-IT', { minimumFractionDigits: 1 });
// Il ritmo di un tratto va a due decimali: a uno solo, 0,12 kg a settimana diventa «0,1» e un
// tratto lento è indistinguibile da un tratto fermo.
const fmtRitmo = n => (n == null || isNaN(n)) ? '—' : (Math.round(n * 100) / 100).toLocaleString('it-IT', { minimumFractionDigits: 2 });

// La data locale, non quella UTC: alle 01:30 di notte toUTCString() direbbe ancora ieri, e la
// riga finirebbe nel giorno sbagliato. È lo stesso motivo per cui le RPC dei task vogliono
// p_today dal client.
function oggiStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const dataDa = s => new Date(s + 'T12:00:00');   // mezzogiorno: nessun fuso può spostare il giorno
const giorniFra = (a, b) => Math.round((dataDa(b) - dataDa(a)) / 86400000);
function piuGiorni(s, n) { const d = dataDa(s); d.setDate(d.getDate() + n); return oggiStr(d); }
const fmtData = s => s ? dataDa(s).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'long' }) : '—';
const fmtDataBreve = s => s ? dataDa(s).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) : '—';

function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ═══════════════════════════════════════════════════════════════
   IL CONTO DELLE CALORIE
   ═══════════════════════════════════════════════════════════════ */

// L'età compiuta a una certa data. Dalla data di nascita e non da un numero scritto a mano:
// un'età archiviata è giusta un anno solo, poi comincia a mentire senza dirlo.
function etaAl(giorno) {
  if (!S.profile?.birth_date) return null;
  const n = dataDa(S.profile.birth_date), d = dataDa(giorno);
  let e = d.getFullYear() - n.getFullYear();
  const m = d.getMonth() - n.getMonth();
  if (m < 0 || (m === 0 && d.getDate() < n.getDate())) e--;
  return e;
}

// Mifflin-St Jeor, che è la formula che le linee guida preferiscono a Harris-Benedict:
//   uomo:  10×kg + 6.25×cm − 5×età + 5
//   donna: 10×kg + 6.25×cm − 5×età − 161
function metabolismoBasale(pesoKg, giorno) {
  const p = S.profile;
  if (!p || !p.height_cm || !p.sex || !p.birth_date || !pesoKg) return null;
  const eta = etaAl(giorno);
  if (eta == null || eta < 10 || eta > 110) return null;
  const base = 10 * pesoKg + 6.25 * (+p.height_cm) - 5 * eta;
  return base + correzioneSesso(p.sex);
}

// Il peso di un giorno: il MINIMO delle pesate di quel giorno, come fa «Ti pisasti?» — ci si
// pesa più volte e quella che conta è la più bassa. Se quel giorno non c'è nessuna pesata si
// ripiega sull'ultima nota PRIMA di quel giorno: il peso di domani non può entrare nel conto
// di ieri, o un giorno passato cambierebbe verdetto ogni volta che si sale sulla bilancia.
function pesoAl(giorno) {
  const delGiorno = S.weights.filter(w => w.date === giorno && num(w.weight) != null);
  if (delGiorno.length) return Math.min(...delGiorno.map(w => +w.weight));
  const prima = S.weights.filter(w => w.date < giorno && num(w.weight) != null);
  if (!prima.length) return null;
  const ultimo = prima.reduce((a, b) => (a.date >= b.date ? a : b));
  return +ultimo.weight;
}

// Il peso che il piano dell'obiettivo chiede per una certa data: interpolazione lineare fra le
// due milestone che la contengono. Ricalcata da getInterpolatedTarget() di weight-quest.html —
// ⚠️ se cambia là, va cambiata anche qui, o le due pagine daranno due traguardi diversi per lo
// stesso giorno.
function pesoPianoAl(giorno) {
  const ms = S.milestones;
  if (!ms || ms.length < 2) return null;
  if (giorno <= ms[0].date) return +ms[0].weight;
  const ultima = ms[ms.length - 1];
  if (giorno >= ultima.date) return +ultima.weight;
  for (let i = 0; i < ms.length - 1; i++) {
    const a = ms[i], b = ms[i + 1];
    if (giorno >= a.date && giorno <= b.date) {
      const tot = giorniFra(a.date, b.date);
      if (!tot) return +a.weight;
      const q = giorniFra(a.date, giorno) / tot;
      return Math.round((+a.weight + (+b.weight - +a.weight) * q) * 100) / 100;
    }
  }
  return null;
}

/* Il TRATTO del piano che contiene un giorno: le due milestone che lo racchiudono e il ritmo
   che chiedono. È il pezzo che rende diversi i target di due periodi dello stesso obiettivo —
   un piano che chiede 3 kg nel primo mese e 1 kg nei due successivi non può dare lo stesso
   numero in entrambi.

   Torna null quando il piano non c'è (meno di due traguardi) o è finito: in quei casi il conto
   ripiega sulla media fino alla fine, che è quel che si può dire senza una curva. */
function segmentoDi(giorno) {
  const ms = S.milestones;
  if (!ms || ms.length < 2) return null;
  if (giorno >= ms[ms.length - 1].date) return null;   // il piano è finito
  let i = 0;
  for (let k = 0; k < ms.length - 1; k++) {
    if (giorno >= ms[k].date && giorno < ms[k + 1].date) { i = k; break; }
  }
  const a = ms[i], b = ms[i + 1];
  const giorni = giorniFra(a.date, b.date);
  if (!giorni) return null;
  return {
    inizio: a.date, fine: b.date, pesoInizio: +a.weight, pesoFine: +b.weight, giorni,
    numero: i + 1, quanti: ms.length - 1,
    // positivo = si deve perdere. Il ritmo del tratto, non della media dell'obiettivo.
    kgAlGiorno: (+a.weight - +b.weight) / giorni,
  };
}

/* Il conto vero e proprio. Torna sempre un oggetto: `ok` false dice PERCHÉ manca il numero,
   perché «non lo so» e «zero» sono due cose diverse — un target a zero farebbe sembrare
   sforata ogni giornata. */
function calcolaTarget(giorno) {
  const out = { ok: false, motivo: null, kcal: null, bmr: null, tdee: null, deficit: 0,
                peso: null, pesoPiano: null, pesoFinale: null, giorniRimasti: null,
                kgDaPerdere: null, sottoSoglia: false, avvisi: [],
                // Il deficit in due addendi: il ritmo che il tratto di piano chiede, e il
                // recupero dello scarto accumulato. Servono a schermo, perché un numero solo
                // non direbbe se oggi è più stretto perché il piano corre o perché si è indietro.
                segmento: null, deficitPiano: null, scartoKg: null, recupero: null };

  const p = S.profile;
  if (!p || !p.birth_date || !p.height_cm || !p.sex) { out.motivo = 'profilo'; return out; }

  const peso = pesoAl(giorno);
  if (peso == null) { out.motivo = 'peso'; return out; }
  out.peso = peso;

  const bmr = metabolismoBasale(peso, giorno);
  if (bmr == null) { out.motivo = 'profilo'; return out; }
  out.bmr = bmr;
  out.tdee = bmr * (+p.activity || 1.375);

  const ob = S.objective;
  if (!ob) {
    // Senza obiettivo attivo non si inventa un dimagrimento: il target è il mantenimento, e la
    // pagina lo dice invece di far finta che ci sia un piano.
    out.ok = true; out.kcal = out.tdee; out.motivo = 'mantenimento';
    return out;
  }

  out.pesoPiano = pesoPianoAl(giorno);
  // ⚠️ L'ultimo traguardo vale come peso finale solo se i traguardi sono almeno DUE: uno solo è
  // il punto di partenza, non la meta, e prenderlo per tale fa credere l'obiettivo già raggiunto
  // (peso di oggi ≤ «finale») e azzera il deficit senza dire niente.
  const finale = S.milestones.length >= 2 ? +S.milestones[S.milestones.length - 1].weight : num(ob.end_weight);
  out.pesoFinale = finale;

  const fine = ob.end_date || (S.milestones.length ? S.milestones[S.milestones.length - 1].date : null);
  // Almeno un giorno: a fine obiettivo la divisione per zero darebbe un deficit infinito, e a
  // obiettivo scaduto un deficit negativo — cioè un invito a mangiare di più proprio il giorno
  // in cui il tempo è finito.
  out.giorniRimasti = fine ? Math.max(1, giorniFra(giorno, fine)) : null;

  if (finale == null || out.giorniRimasti == null) {
    out.ok = true; out.kcal = out.tdee; out.motivo = 'mantenimento';
    return out;
  }

  out.kgDaPerdere = Math.max(0, peso - finale);

  /* ⚠️ IL DEFICIT È LA SOMMA DI DUE COSE, e vanno tenute separate.

     1. il RITMO DEL TRATTO in cui si è oggi. Un obiettivo con i traguardi ravvicinati all'inizio
        e radi dopo chiede molto adesso e poco poi: spalmare tutta la perdita residua su tutto il
        tempo residuo — che è quel che faceva la v1.0.1 — dà lo stesso numero nei due tratti, e
        quindi fa restare indietro proprio dove il piano correva. Un piano che chiede 0,70 kg a
        settimana vuole ~770 kcal al giorno, non i 322 della media.
     2. il RECUPERO dello scarto già accumulato, spalmato sui giorni che restano **in tutto** e
        non su quelli del tratto. È questo addendo che tiene la proprietà per cui il target si
        stringe da sé quando si resta indietro; metterlo nel solo tratto in corso lo renderebbe
        feroce a ridosso di un traguardo — due chili da recuperare in cinque giorni non sono un
        obiettivo, e il target ne uscirebbe schiacciato tutti i giorni.

     Senza il primo addendo il piano non si sente; senza il secondo non ci si accorge di essere
     rimasti indietro. Servono tutti e due. */
  const seg = segmentoDi(giorno);
  out.segmento = seg;

  if (seg && out.pesoPiano != null) {
    out.deficitPiano = seg.kgAlGiorno * KCAL_PER_KG;
    out.scartoKg = peso - out.pesoPiano;
    out.recupero = out.scartoKg * KCAL_PER_KG / out.giorniRimasti;
    // Mai sotto zero: essere avanti sul piano allenta il target fino al mantenimento, non oltre.
    // Un deficit negativo sarebbe l'app che invita a mangiare di più per tornare sulla curva.
    out.deficit = Math.max(0, out.deficitPiano + out.recupero);
  } else {
    // Nessuna curva (meno di due traguardi) o piano già finito: resta la media fino alla fine,
    // che è tutto quel che si può dire senza sapere come il piano voleva distribuirla.
    out.deficit = out.kgDaPerdere * KCAL_PER_KG / out.giorniRimasti;
  }

  // Il target è quello che esce dal conto, senza pavimenti: se il piano chiede troppo, si vede.
  out.kcal = out.tdee - out.deficit;
  out.motivo = out.kgDaPerdere > 0 ? 'obiettivo' : 'raggiunto';

  // ⚠️ Nessun taglio: solo un avviso. Il numero resta quello che il piano chiede — anche negativo,
  // che è il modo più chiaro di dire che in quei giorni quel peso non ci si arriva nemmeno
  // digiunando. Spostare i traguardi è una decisione, e la prende chi legge.
  const soglia = sogliaAvviso(p.sex);
  if (out.kcal <= 0) {
    out.sottoSoglia = true;
    out.avvisi.push(`Il piano chiede più di quanto il corpo consuma in un giorno: il target esce negativo (${fmtKcal(out.kcal)} kcal). In ${out.giorniRimasti} ${out.giorniRimasti === 1 ? 'giorno' : 'giorni'} quei ${fmtKg(out.kgDaPerdere)} kg non si perdono — la data di fine va spostata in «Ti pisasti?».`);
  } else if (out.kcal < soglia) {
    out.sottoSoglia = true;
    out.avvisi.push(`Target sotto le ${soglia} kcal: è poco, e quasi sempre vuol dire che i traguardi sono troppo ravvicinati. Il numero non è stato ritoccato — se lo vuoi più largo, allarga il piano in «Ti pisasti?».`);
  } else if (out.deficit > 1000) {
    out.avvisi.push(`Il piano chiede un deficit di ${fmtKcal(out.deficit)} kcal al giorno, cioè oltre un chilo a settimana. È tanto: se non regge, sposta la data di fine invece di saltare i pasti.`);
  }
  out.ok = true;
  return out;
}

/* La stima delle calorie tratto per tratto: quanto chiederà ciascun periodo del piano.

   ⚠️ Ogni tratto si calcola SUL PESO CHE IL PIANO PREVEDE lì, non su quello di oggi: il
   metabolismo basale cala col peso, quindi l'ultimo tratto di un dimagrimento chiede meno
   calorie a parità di ritmo, e usare il peso di oggi per tutti darebbe numeri troppo alti verso
   la fine. Si prende il peso MEDIO del tratto (fra il traguardo che lo apre e quello che lo
   chiude), che è la media del basale su quel periodo.

   ⚠️ Qui il recupero dello scarto NON entra: questi sono i numeri «se stai sul piano». Metterlo
   nel solo tratto in corso renderebbe una riga incomparabile con le altre, e nei tratti futuri
   sarebbe un'invenzione — lo scarto di domani non si conosce. Il conto vero di oggi, recupero
   compreso, sta nel riquadro del Diario. */
function stimaTratti() {
  const ms = S.milestones;
  const p = S.profile;
  if (!ms || ms.length < 2 || !p?.birth_date || !p?.height_cm || !p?.sex) return [];
  const oggi = oggiStr();
  const out = [];
  for (let i = 0; i < ms.length - 1; i++) {
    const a = ms[i], b = ms[i + 1];
    const giorni = giorniFra(a.date, b.date);
    if (!giorni) continue;
    const pesoMedio = (+a.weight + +b.weight) / 2;
    const bmr = metabolismoBasale(pesoMedio, a.date);
    const tdee = bmr == null ? null : bmr * (+p.activity || 1.375);
    const kgAlGiorno = (+a.weight - +b.weight) / giorni;
    const deficit = kgAlGiorno * KCAL_PER_KG;
    out.push({
      numero: i + 1, inizio: a.date, fine: b.date, giorni,
      pesoInizio: +a.weight, pesoFine: +b.weight, kg: +a.weight - +b.weight,
      kgAlGiorno, pesoMedio, bmr, tdee,
      deficit, target: tdee == null ? null : tdee - deficit,
      corrente: oggi >= a.date && oggi < b.date,
      passato: oggi >= b.date,
    });
  }
  return out;
}

// Il target da mostrare per un giorno: quello congelato se c'è, altrimenti quello calcolato ora.
// La riga congelata vince sempre — è il senso stesso del congelamento.
function targetDelGiorno(giorno) {
  const riga = S.days[giorno];
  if (riga && num(riga.kcal_target) != null) {
    return { ok: true, congelato: true, kcal: +riga.kcal_target, bmr: num(riga.bmr), tdee: num(riga.tdee),
             deficit: num(riga.deficit_kcal) || 0, peso: num(riga.weight_kg),
             pesoPiano: pesoPianoAl(giorno), motivo: 'congelato', avvisi: [] };
  }
  const c = calcolaTarget(giorno);
  c.congelato = false;
  return c;
}

/* ═══════════════════════════════════════════════════════════════
   CARICAMENTO DATI
   ═══════════════════════════════════════════════════════════════ */

// Quanto indietro si guarda. Il diario e le pesate servono per il grafico e per il peso di
// riferimento; tre mesi bastano e tengono la pagina leggera.
const GIORNI_STORICO = 120;

async function loadData() {
  const da = piuGiorni(oggiStr(), -GIORNI_STORICO);

  const [profile, comune, objectives, weights, foods, logs, days, pasti] = await Promise.all([
    sbQ('al_profile', 'select=*&limit=1'),
    sbQ('cm_profile', 'select=data_nascita,altezza_cm,sesso,nome&limit=1'),
    // L'ultimo obiettivo ATTIVO: è quello su cui si sta lavorando adesso. Gli obiettivi chiusi
    // restano in archivio ma non devono dettare il target di oggi.
    sbQ('ps_objectives', 'status=eq.active&order=created_at.desc&limit=1'),
    sbQ('ps_weight_tracking', `date=gte.${da}&order=date.asc&limit=2000`),
    sbQ('al_foods', 'select=*&order=favorite.desc,times_used.desc,name.asc&limit=2000'),
    sbQ('al_log', `day=gte.${da}&order=day.desc,created_at.asc&limit=5000`),
    sbQ('al_days', `day=gte.${da}&limit=500`),
    // cm_settings è la tabella chiave/valore della suite. Se la riga non c'è valgono tutti e sei
    // i pasti: l'app funziona senza essere configurata, e la configurazione è una preferenza.
    sbQ('cm_settings', `key=eq.${CHIAVE_PASTI}&select=value&limit=1`).catch(() => []),
  ]);

  S.cmProfile = comune?.[0] || null;
  S.profile = fondiProfilo(S.cmProfile, profile?.[0] || null);
  S.objective = objectives?.[0] || null;
  S.milestones = leggiMilestones(S.objective);
  S.weights = weights || [];
  S.foods = foods || [];
  S.logs = logs || [];
  S.days = {};
  (days || []).forEach(d => { S.days[d.day] = d; });
  S.pasti = leggiPasti(pasti?.[0]?.value);
}

// `milestones` è archiviata come stringa JSON da weight-quest.html, ma una colonna jsonb può
// tornare già come array: si accettano tutt'e due invece di dare per scontato quale delle due
// arriva. In ordine di data, perché l'interpolazione lo dà per scontato.
function leggiMilestones(ob) {
  if (!ob) return [];
  let ms = ob.milestones;
  if (typeof ms === 'string') { try { ms = JSON.parse(ms); } catch { ms = null; } }
  if (!Array.isArray(ms)) return [];
  return ms.filter(m => m && m.date && m.weight != null)
           .map(m => ({ date: String(m.date).slice(0, 10), weight: +m.weight }))
           .sort((a, b) => a.date.localeCompare(b.date));
}

/* I dati anagrafici da cm_profile, il fattore di attività da al_profile. Se cm_profile non c'è
   ancora, il profilo resta incompleto e la pagina lo dice mandando al 👤 Profilo di AppSphere:
   non li richiede qui, o diventerebbero due verità sulla stessa altezza. */
function fondiProfilo(comune, mio) {
  return {
    birth_date: comune?.data_nascita || null,
    height_cm:  num(comune?.altezza_cm),
    sex:        comune?.sesso || null,
    activity:   num(mio?.activity) || 1.375,
  };
}

/* La configurazione dei pasti archiviata come JSON in cm_settings.value.

   Si scartano gli id che non sono fra i sei di PASTI_BASE: un valore rimasto lì da una versione
   futura o scritto a mano finirebbe in `al_log.meal` e il CHECK del database rifiuterebbe la
   riga — cioè si scoprirebbe salvando, non aprendo. Una configurazione vuota o illeggibile vale
   come «non configurato», e allora si usano tutti e sei. */
function leggiPasti(valore) {
  if (!valore) return null;
  let v = valore;
  if (typeof v === 'string') { try { v = JSON.parse(v); } catch { return null; } }
  if (!Array.isArray(v)) return null;
  const buoni = v.filter(p => p && pastoBase(p.id))
                 .map(p => ({ id: p.id, label: (p.label || '').trim() || pastoBase(p.id).label }));
  return buoni.length ? buoni : null;
}

async function salvaPasti(elenco) {
  await sbIns('cm_settings?on_conflict=key',
    [{ key: CHIAVE_PASTI, value: JSON.stringify(elenco) }],
    { 'Prefer': 'resolution=merge-duplicates,return=minimal' });
}

async function reload() {
  await loadData();
  render();
}

/* ═══════════════════════════════════════════════════════════════
   LE BANCHE DATI — tutte dietro una Edge Function
   ═══════════════════════════════════════════════════════════════ */

/* ⚠️ La pagina non parla più direttamente con Open Food Facts. Ogni ricerca passa dalla Edge
   Function `al-food-search`, che gira sui server di Supabase. Quattro cose che dal browser non
   si potevano avere:

     · CORS non è più un problema, quindi si possono usare servizi che gli header giusti non li
       mandano — e quali li mandino non lo decidiamo noi;
     · le chiavi (USDA, e domani altri) stanno nei Secrets invece che in chiaro in questo file;
     · più fonti, una forma sola: qui arriva sempre lo stesso oggetto, comunque sia fatta la
       risposta di chi ha risposto;
     · ogni fonte torna col suo esito, quindi «il servizio è giù» e «quel prodotto non c'è»
       smettono di sembrare la stessa cosa — che è il motivo per cui la ricerca è rimasta rotta
       per giorni senza dirlo.

   ⚠️ La NORMALIZZAZIONE sta tutta di là. Qui non c'è più nessuna copia di daOFF(): due
   implementazioni della stessa conversione sono due valori diversi per lo stesso prodotto il
   giorno che una delle due cambia. */
const RITARDO_RICERCA = 700;

async function sbFn(nome, payload) {
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${nome}`, {
    method: 'POST', headers: sbH(), body: JSON.stringify(payload || {}),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d?.error) throw new Error(d?.error || `HTTP ${r.status}`);
  return d;
}

/* Cerca un alimento nelle banche dati. `{ q }` per nome, `{ barcode }` per codice a barre.
   Torna { alimenti, esiti }: `esiti` c'è quando non si è trovato niente (o se lo si chiede) e
   dice quale fonte ha risposto cosa. */
async function cercaOnline(richiesta) {
  const d = await sbFn('al-food-search', richiesta);
  return { alimenti: d.alimenti || [], esiti: d.esiti || [] };
}

// Il riassunto in una riga di cosa hanno risposto le fonti: è quel che si mostra all'utente
// quando una ricerca torna vuota, al posto di un «niente trovato» che non spiega niente.
function riassumiEsiti(esiti) {
  if (!esiti || !esiti.length) return '';
  return esiti.map(e => {
    const che = e.fonte.replace(/^openfoodfacts\//, 'OFF ');
    if (e.errore) return `${che}: non raggiungibile (${e.errore})`;
    if (!e.ok) return `${che}: HTTP ${e.http}`;
    return `${che}: ${e.trovati} risultati`;
  }).join(' · ');
}

/* ═══════════════════════════════════════════════════════════════
   SCRITTURE
   ═══════════════════════════════════════════════════════════════ */

const CAMPI_NUTRIENTI = ['kcal_100g', 'proteins_100g', 'fat_100g', 'sat_fat_100g',
                         'carbs_100g', 'sugars_100g', 'fiber_100g', 'salt_100g'];

/* Congela il target del giorno la prima volta che ci si scrive qualcosa.

   `resolution=ignore-duplicates` e non un upsert: se la riga c'è già NON si tocca, ed è tutto
   il punto — un upsert la riscriverebbe col peso di oggi ogni volta che si aggiunge un alimento,
   cioè il congelamento non esisterebbe. */
async function congelaGiorno(giorno) {
  if (S.days[giorno]) return S.days[giorno];
  const c = calcolaTarget(giorno);
  if (!c.ok) return null;
  try {
    await sbIns('al_days?on_conflict=user_id,day', [{
      user_id: uid(),
      day: giorno,
      kcal_target: Math.round(c.kcal),
      weight_kg: c.peso,
      bmr: c.bmr == null ? null : Math.round(c.bmr),
      tdee: c.tdee == null ? null : Math.round(c.tdee),
      deficit_kcal: Math.round(c.deficit || 0),
      objective_id: S.objective?.id || null,
    }], { 'Prefer': 'resolution=ignore-duplicates,return=representation' });
  } catch (err) {
    // Un target non congelato non impedisce di segnare quel che si è mangiato: la riga del
    // diario è il dato, il target è il commento. Si riprova alla prossima apertura.
    console.warn('congelaGiorno:', err.message);
  }
  const righe = await sbQ('al_days', `day=eq.${giorno}&limit=1`);
  if (righe?.[0]) S.days[giorno] = righe[0];
  return S.days[giorno] || null;
}

// Ricalcola il target di UN giorno, su richiesta esplicita. Solo così: automatico riscriverebbe
// il passato, che è esattamente ciò che il congelamento evita.
async function ricalcolaGiorno(giorno) {
  const c = calcolaTarget(giorno);
  if (!c.ok) { alert('Non si può ricalcolare: ' + spiegaMotivo(c.motivo)); return; }
  await sbUpd('al_days', `day=eq.${giorno}`, {
    kcal_target: Math.round(c.kcal), weight_kg: c.peso,
    bmr: c.bmr == null ? null : Math.round(c.bmr),
    tdee: c.tdee == null ? null : Math.round(c.tdee),
    deficit_kcal: Math.round(c.deficit || 0),
    objective_id: S.objective?.id || null,
    updated_at: new Date().toISOString(),
  });
  showToast('🔄 Target del giorno ricalcolato');
  await reload();
}

/* Salva un alimento trovato su Open Food Facts nel catalogo, così la seconda volta è già lì e
   non serve nessuna ricerca. Se il codice a barre c'è già si aggiorna quella riga: lo stesso
   prodotto non deve comparire due volte nell'elenco. */
async function salvaAlimentoOff(a) {
  const esistente = a.barcode ? S.foods.find(f => f.barcode === a.barcode) : null;
  const payload = {
    name: a.name, brand: a.brand, barcode: a.barcode, source: 'off',
    kcal_100g: a.kcal_100g, proteins_100g: a.proteins_100g, fat_100g: a.fat_100g,
    sat_fat_100g: a.sat_fat_100g, carbs_100g: a.carbs_100g, sugars_100g: a.sugars_100g,
    fiber_100g: a.fiber_100g, salt_100g: a.salt_100g, default_grams: a.default_grams,
    updated_at: new Date().toISOString(),
  };
  if (esistente) {
    const [r] = await sbUpd('al_foods', `id=eq.${esistente.id}`, payload);
    return r;
  }
  const [r] = await sbIns('al_foods', [payload]);
  return r;
}

// Aggiunge una riga al diario. I valori per 100 g si copiano SULLA RIGA: correggere domani le
// calorie di un alimento non deve riscrivere quel che si è mangiato oggi.
async function aggiungiAlDiario({ giorno, meal, alimento, grammi, foodId }) {
  const riga = {
    day: giorno, meal, food_id: foodId || null,
    name: alimento.name, brand: alimento.brand || null, grams: grammi,
  };
  CAMPI_NUTRIENTI.forEach(c => { riga[c] = num(alimento[c]); });
  await congelaGiorno(giorno);
  await sbIns('al_log', [riga]);
  if (foodId) {
    const f = S.foods.find(x => x.id === foodId);
    if (f) await sbUpd('al_foods', `id=eq.${foodId}`, { times_used: (f.times_used || 0) + 1 }).catch(() => {});
  }
}

/* ═══════════════════════════════════════════════════════════════
   CONTI SULLE RIGHE DEL DIARIO
   ═══════════════════════════════════════════════════════════════ */

// Una riga porta i valori per 100 g e i grammi: le calorie sono la moltiplicazione. Si fa qui e
// in un posto solo, così non c'è modo che due schermate diano due numeri per la stessa riga.
const perRiga = (r, campo) => (num(r[campo]) == null ? null : +r[campo] * (+r.grams) / 100);
const kcalDi = r => perRiga(r, 'kcal_100g') || 0;

function righeDelGiorno(giorno) {
  return S.logs.filter(r => r.day === giorno);
}
function totaliDi(righe) {
  const t = { kcal: 0, proteine: 0, grassi: 0, saturi: 0, carbo: 0, zuccheri: 0, fibre: 0, sale: 0 };
  righe.forEach(r => {
    t.kcal     += kcalDi(r);
    t.proteine += perRiga(r, 'proteins_100g') || 0;
    t.grassi   += perRiga(r, 'fat_100g') || 0;
    t.saturi   += perRiga(r, 'sat_fat_100g') || 0;
    t.carbo    += perRiga(r, 'carbs_100g') || 0;
    t.zuccheri += perRiga(r, 'sugars_100g') || 0;
    t.fibre    += perRiga(r, 'fiber_100g') || 0;
    t.sale     += perRiga(r, 'salt_100g') || 0;
  });
  return t;
}

function spiegaMotivo(motivo) {
  if (motivo === 'profilo') return 'mancano i dati anagrafici — si compilano in AppSphere → ☰ → 👤 Profilo (data di nascita, altezza, sesso)';
  if (motivo === 'peso') return 'manca una pesata — segnane una in «Ti pisasti?», il target si calcola sul peso';
  return 'dato mancante';
}

/* Le opzioni della tendina dei pasti. Il pasto già scelto compare SEMPRE, anche se nel
   frattempo è stato spento: aprire una riga vecchia e trovare la tendina su un pasto diverso
   da quello in cui la riga sta la sposterebbe al primo salvataggio, senza che nessuno l'abbia
   chiesto. */
function opzioniPasto(scelto) {
  const voci = pastiAttivi();
  if (scelto && !voci.some(v => v.id === scelto)) {
    const b = pastoBase(scelto);
    if (b) voci.push({ ...b, label: b.label + ' (pasto tolto)' });
  }
  return voci.map(p => `<option value="${p.id}" ${p.id === scelto ? 'selected' : ''}>${esc(p.label)}</option>`).join('');
}

// Il pasto proposto in base all'ora: si segna quel che si è appena mangiato, e alle 13 è il
// pranzo nove volte su dieci. Resta cambiabile — è una proposta, non una regola.
function pastoDellOra() {
  const h = new Date().getHours();
  // Fra i soli pasti attivi: proporre un pasto che l'utente ha spento vorrebbe dire aprire la
  // finestra su una voce che nella tendina non c'è.
  const att = pastiAttivi();
  return (att.find(p => h < p.oraFino) || att[att.length - 1]).id;
}

/* ═══════════════════════════════════════════════════════════════
   VISTA: DIARIO
   ═══════════════════════════════════════════════════════════════ */

function renderDiario() {
  const giorno = S.day;
  const oggi = oggiStr();
  const t = targetDelGiorno(giorno);
  const righe = righeDelGiorno(giorno);
  const tot = totaliDi(righe);
  const mangiate = tot.kcal;
  const restano = t.ok ? t.kcal - mangiate : null;
  const quota = t.ok && t.kcal > 0 ? Math.min(100, (mangiate / t.kcal) * 100) : 0;
  const sforato = t.ok && mangiate > t.kcal;
  const colore = !t.ok ? 'var(--c-muted)' : sforato ? 'var(--c-danger)' : quota > 85 ? 'var(--c-warning)' : 'var(--c-primary)';

  let h = `
  <div class="view-header">
    <div>
      <div class="page-title">📓 Diario</div>
      <div class="page-sub">${esc(fmtData(giorno))}${giorno === oggi ? ' · oggi' : ''}</div>
    </div>
    <div class="day-nav">
      <button class="btn btn-outline btn-sm" data-action="giorno-prec">‹</button>
      <input type="date" class="form-input" id="day-picker" value="${giorno}" max="${oggi}" />
      <button class="btn btn-outline btn-sm" data-action="giorno-succ" ${giorno >= oggi ? 'disabled' : ''}>›</button>
      ${giorno !== oggi ? '<button class="btn btn-outline btn-sm" data-action="giorno-oggi">Oggi</button>' : ''}
    </div>
  </div>`;

  // ── I quattro numeri che si guardano per primi ──
  h += `<div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Target</div>
      <div class="kpi-value">${t.ok ? fmtKcal(t.kcal) : '—'}</div>
      <div class="kpi-note">${t.ok ? 'kcal' + (t.congelato ? ' · congelato' : '') : 'da calcolare'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Mangiate</div>
      <div class="kpi-value">${fmtKcal(mangiate)}</div>
      <div class="kpi-note">${righe.length} ${righe.length === 1 ? 'riga' : 'righe'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">${sforato ? 'Sforate' : 'Restano'}</div>
      <div class="kpi-value" style="color:${colore}">${restano == null ? '—' : fmtKcal(Math.abs(restano))}</div>
      <div class="kpi-note">${restano == null ? '' : 'kcal'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Peso</div>
      <div class="kpi-value">${t.peso == null ? '—' : fmtKg(t.peso)}</div>
      <div class="kpi-note">${t.peso == null ? 'nessuna pesata' : 'kg' + (t.pesoPiano != null ? ' · piano ' + fmtKg(t.pesoPiano) : '')}</div>
    </div>
  </div>`;

  // ── La barra: quanto del target è già stato mangiato ──
  h += `<div class="card">
    <div class="bar-track"><div class="bar-fill" style="width:${quota}%;background:${colore}"></div></div>
    <div class="bar-legend">
      <span>${fmtKcal(mangiate)} kcal</span>
      <span>${t.ok ? 'target ' + fmtKcal(t.kcal) + ' kcal' : 'target non calcolabile'}</span>
    </div>
    ${renderSpiegazioneTarget(t, giorno)}
  </div>`;

  // ── I pasti ──
  h += '<div class="card-header-row mt-16"><div class="card-title">I pasti</div>'
     + `<button class="btn btn-primary btn-sm" data-action="aggiungi" data-meal="${pastoDellOra()}">➕ Aggiungi alimento</button></div>`;

  pastiDelGiorno(giorno).forEach(p => {
    const rp = righe.filter(r => r.meal === p.id);
    // Un pasto vuoto in un giorno passato è rumore: si mostra solo se ha qualcosa dentro, o se
    // il giorno è oggi — dove il riquadro vuoto è l'invito a riempirlo.
    if (!rp.length && giorno !== oggi) return;
    const k = rp.reduce((s, r) => s + kcalDi(r), 0);
    h += `<div class="meal">
      <div class="meal-head">
        <span class="meal-name grow">${p.label}${p.tolto ? ' <span class="badge badge-none">pasto tolto</span>' : ''}</span>
        <span class="meal-kcal">${fmtKcal(k)} kcal</span>
        ${p.tolto ? '' : `<button class="btn-icon" data-action="aggiungi" data-meal="${p.id}" title="Aggiungi a ${esc(p.label)}">➕</button>`}
      </div>
      <div class="meal-rows">`;
    if (!rp.length) {
      h += '<div class="meal-empty">Niente ancora.</div>';
    } else {
      rp.forEach(r => {
        h += `<div class="food-row">
          <div class="grow">
            <div class="food-name">${esc(r.name)}${r.brand ? ' <span class="text-muted text-xs">' + esc(r.brand) + '</span>' : ''}</div>
            <div class="food-sub">${fmtG(r.grams)} g · ${fmtKcal(r.kcal_100g)} kcal/100 g</div>
          </div>
          <span class="food-kcal">${fmtKcal(kcalDi(r))}</span>
          <button class="btn-icon" data-action="modifica-riga" data-id="${r.id}" title="Cambia i grammi">✏️</button>
          <button class="btn-icon btn-icon-danger" data-action="elimina-riga" data-id="${r.id}" title="Elimina">🗑</button>
        </div>`;
      });
    }
    h += '</div></div>';
  });

  // ── I macro della giornata ──
  if (righe.length) {
    h += `<div class="card mt-16">
      <div class="card-title">Cosa c'era dentro</div>
      <div class="macro-grid">
        ${boxMacro('Proteine', tot.proteine, 'g')}
        ${boxMacro('Grassi', tot.grassi, 'g')}
        ${boxMacro('di cui saturi', tot.saturi, 'g')}
        ${boxMacro('Carboidrati', tot.carbo, 'g')}
        ${boxMacro('di cui zuccheri', tot.zuccheri, 'g')}
        ${boxMacro('Fibre', tot.fibre, 'g')}
        ${boxMacro('Sale', tot.sale, 'g')}
      </div>
      <div class="grid-2 mt-16">
        <div><div class="card-title text-sm">Da dove vengono le calorie</div><div class="chart-wrap-sm"><canvas id="ch-macro"></canvas></div></div>
        <div class="text-sm text-muted" style="align-self:center">
          I grammi si contano solo dove l'alimento li dichiara: un prodotto senza fibre nell'etichetta
          conta zero fibre, che non vuol dire che non ne abbia.
          <div class="mt-8">Proteine e carboidrati valgono 4 kcal al grammo, i grassi 9: è per questo che
          un cucchiaio d'olio pesa poco e conta tanto.</div>
        </div>
      </div>
    </div>`;
  }

  setHtml('view-diario', h);
  if (righe.length) disegnaMacro(tot);
}

function boxMacro(label, valore, unita) {
  return `<div class="macro-box"><div class="macro-label">${esc(label)}</div>
    <div class="macro-value">${fmtG(valore)} ${unita}</div></div>`;
}

/* Il riquadro che spiega da dove esce il target. Non è decorazione: un numero calcolato da
   quattro grandezze che nessuno vede è un numero di cui non ci si può fidare, e alla prima
   sorpresa si smette di seguirlo. */
function renderSpiegazioneTarget(t, giorno) {
  if (!t.ok) {
    return `<div class="note-box is-warn mt-12">Il target di oggi non si può calcolare: ${esc(spiegaMotivo(t.motivo))}.</div>`;
  }
  let testo = '';
  if (t.motivo === 'mantenimento') {
    testo = `Nessun obiettivo attivo in «Ti pisasti?»: il target è il <strong>mantenimento</strong> — `
          + `basale ${fmtKcal(t.bmr)} × attività = ${fmtKcal(t.tdee)} kcal.`;
  } else if (t.motivo === 'raggiunto') {
    testo = `Il peso finale è già raggiunto: il target torna al mantenimento, ${fmtKcal(t.tdee)} kcal.`;
  } else if (t.motivo === 'congelato') {
    testo = `Target congelato per questa giornata: ${fmtKcal(t.kcal)} kcal`
          + (t.tdee ? ` (consumo stimato ${fmtKcal(t.tdee)} − deficit ${fmtKcal(t.deficit)})` : '')
          + (t.peso != null ? `, sul peso di ${fmtKg(t.peso)} kg.` : '.');
  } else {
    testo = `Consumo stimato ${fmtKcal(t.tdee)} kcal (basale ${fmtKcal(t.bmr)} × attività ${(+S.profile.activity).toLocaleString('it-IT')}) `
          + `− ${fmtKcal(t.deficit)} kcal di deficit = <strong>${fmtKcal(t.kcal)} kcal</strong>.`;
  }
  const scarto = t.motivo === 'obiettivo' ? spiegaDeficit(t) : '';
  const avvisi = (t.avvisi || []).map(a => `<div class="note-box is-danger mt-8">⚠️ ${esc(a)}</div>`).join('');
  const puoRicalcolare = t.congelato && S.days[giorno];
  return `<div class="note-box mt-12">${testo}${scarto}
      ${puoRicalcolare ? `<div class="mt-8"><button class="btn btn-outline btn-sm" data-action="ricalcola" data-day="${giorno}">🔄 Ricalcola questa giornata</button></div>` : ''}
    </div>${avvisi}`;
}

/* Da dove viene il deficit: il ritmo del tratto e il recupero dello scarto. Due frasi e non un
   numero solo, perché «oggi il target è più stretto» ha due cause diverse — il piano che corre in
   questo tratto, e l'essere rimasti indietro — e sapere quale delle due è cambia cosa si fa. */
function spiegaDeficit(t) {
  const seg = t.segmento;
  if (!seg || t.deficitPiano == null) {
    // Nessuna curva o piano finito: resta la media fino alla fine.
    return ` Il deficit sono i ${fmtKg(t.kgDaPerdere)} kg che mancano al peso finale `
         + `(${fmtKg(t.pesoFinale)} kg) spalmati sui ${t.giorniRimasti} giorni che restano.`;
  }
  const settimana = seg.kgAlGiorno * 7;
  let h = ` <br><br>Il deficit viene da due cose. <strong>Il tratto ${seg.numero} di ${seg.quanti}</strong> del piano `
        + `(${esc(fmtDataBreve(seg.inizio))} → ${esc(fmtDataBreve(seg.fine))}) chiede `
        + `<strong>${fmtRitmo(settimana)} kg a settimana</strong>, cioè ${fmtKcal(t.deficitPiano)} kcal al giorno`;
  if (t.scartoKg == null || Math.abs(t.scartoKg) < 0.05) {
    h += `; sei esattamente sulla curva del piano, quindi non c'è niente da recuperare.`;
  } else {
    const indietro = t.scartoKg > 0;
    h += `. Sei <strong>${indietro ? 'indietro' : 'avanti'} di ${fmtKg(Math.abs(t.scartoKg))} kg</strong> sulla curva: `
       + `${indietro ? '+' : '−'}${fmtKcal(Math.abs(t.recupero))} kcal per ${indietro ? 'recuperarli' : 'tenerne conto'}, `
       + `spalmati sui ${t.giorniRimasti} giorni che restano fino alla fine — non su quelli del tratto, `
       + `o a ridosso di un traguardo il recupero diventerebbe feroce.`;
  }
  if (t.deficit === 0) h += ` Con questo vantaggio il deficit si ferma a zero: oggi basta il mantenimento.`;
  return h;
}

function disegnaMacro(tot) {
  // Le fette sono in CALORIE e non in grammi: in grammi i grassi sembrerebbero una fetta piccola
  // pur essendo spesso la metà dell'energia, che è l'unica cosa che questa torta deve dire.
  const kProt = (tot.proteine || 0) * 4, kCarb = (tot.carbo || 0) * 4, kGras = (tot.grassi || 0) * 9;
  if (kProt + kCarb + kGras <= 0) return;
  drawChart('ch-macro', {
    type: 'doughnut',
    data: {
      labels: ['Proteine', 'Carboidrati', 'Grassi'],
      datasets: [{ data: [kProt, kCarb, kGras].map(v => Math.round(v)),
                   backgroundColor: ['#0891b2', '#d97706', '#dc2626'], borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%',
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: "'DM Sans'", size: 11 }, boxWidth: 11 } },
        tooltip: { callbacks: { label: c => `${c.label}: ${fmtKcal(c.parsed)} kcal` } },
      },
    },
  });
}

function drawChart(id, config) {
  if (S.charts[id]) { S.charts[id].destroy(); delete S.charts[id]; }
  const canvas = $(id);
  if (!canvas) return;
  S.charts[id] = new Chart(canvas.getContext('2d'), config);
}

// I giorni del periodo, dal più vecchio a oggi. Si parte dall'elenco dei GIORNI e non da quello
// delle righe del diario: un giorno saltato deve vedersi come una colonna vuota, non sparire
// dal grafico facendo sembrare che il diario sia stato tenuto tutti i giorni.
function giorniDelPeriodo() {
  const oggi = oggiStr();
  const out = [];
  for (let i = S.periodo - 1; i >= 0; i--) {
    const g = piuGiorni(oggi, -i);
    const righe = righeDelGiorno(g);
    const t = targetDelGiorno(g);
    out.push({
      giorno: g,
      kcal: righe.length ? totaliDi(righe).kcal : null,   // null = non segnato, ≠ zero calorie
      target: t.ok ? t.kcal : null,
      peso: pesoAl(g),
      pesoPiano: pesoPianoAl(g),
      righe: righe.length,
    });
  }
  return out;
}

function renderAndamento() {
  const gg = giorniDelPeriodo();
  const segnati = gg.filter(g => g.kcal != null);
  const conTarget = segnati.filter(g => g.target != null);
  const media = segnati.length ? segnati.reduce((s, g) => s + g.kcal, 0) / segnati.length : null;
  const dentro = conTarget.filter(g => g.kcal <= g.target).length;
  // Il saldo è la somma degli scarti sui soli giorni SEGNATI: sommarci i giorni non segnati come
  // se fossero a zero calorie darebbe un deficit enorme e falso — un giorno non segnato non è un
  // giorno di digiuno.
  const saldo = conTarget.reduce((s, g) => s + (g.kcal - g.target), 0);

  let h = `
  <div class="view-header">
    <div>
      <div class="page-title">📈 Andamento</div>
      <div class="page-sub">Quanto si è mangiato contro quanto si doveva</div>
    </div>
    <select class="form-input form-select" data-action="periodo" style="width:auto">
      ${[14, 30, 60, 90].map(n => `<option value="${n}" ${S.periodo === n ? 'selected' : ''}>Ultimi ${n} giorni</option>`).join('')}
    </select>
  </div>`;

  h += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Media al giorno</div>
      <div class="kpi-value">${fmtKcal(media)}</div>
      <div class="kpi-note">kcal · su ${segnati.length} ${segnati.length === 1 ? 'giorno segnato' : 'giorni segnati'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Dentro il target</div>
      <div class="kpi-value">${conTarget.length ? dentro + '/' + conTarget.length : '—'}</div>
      <div class="kpi-note">${conTarget.length ? Math.round(dentro / conTarget.length * 100) + '%' : ''}</div></div>
    <div class="kpi-card"><div class="kpi-label">Saldo del periodo</div>
      <div class="kpi-value ${saldo > 0 ? 'neg' : 'pos'}">${saldo === 0 ? '0' : (saldo > 0 ? '+' : '−') + fmtKcal(Math.abs(saldo))}</div>
      <div class="kpi-note">kcal ${saldo > 0 ? 'di troppo' : 'in meno'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Vale circa</div>
      <div class="kpi-value ${saldo > 0 ? 'neg' : 'pos'}">${saldo === 0 ? '0' : (saldo > 0 ? '+' : '−') + fmtKg(Math.abs(saldo) / KCAL_PER_KG)}</div>
      <div class="kpi-note">kg rispetto al piano</div></div>
  </div>`;

  h += `<div class="card">
    <div class="card-title">Calorie al giorno</div>
    <div class="chart-wrap"><canvas id="ch-kcal"></canvas></div>
    <div class="text-xs text-muted mt-8">Le colonne sono le calorie segnate, la linea il target di quel giorno.
      Un giorno senza colonna è un giorno non segnato, non un giorno a zero.</div>
  </div>`;

  if (gg.some(g => g.peso != null)) {
    h += `<div class="card">
      <div class="card-title">Peso e curva del piano</div>
      <div class="chart-wrap"><canvas id="ch-peso"></canvas></div>
      <div class="text-xs text-muted mt-8">Il peso viene da «Ti pisasti?» — qui si legge e basta.</div>
    </div>`;
  }

  // ── La tabella, per chi vuole il numero e non la forma ──
  h += `<div class="card"><div class="card-title">Giorno per giorno</div><div class="table-wrap">
    <table class="table"><thead><tr>
      <th>Giorno</th><th class="text-right">Mangiate</th><th class="text-right">Target</th>
      <th class="text-right">Scarto</th><th class="text-right">Peso</th>
    </tr></thead><tbody>`;
  gg.slice().reverse().forEach(g => {
    const scarto = (g.kcal != null && g.target != null) ? g.kcal - g.target : null;
    h += `<tr>
      <td class="nowrap"><button class="cell-link btn-icon" data-action="vai-giorno" data-day="${g.giorno}" style="color:var(--c-primary)">${esc(fmtDataBreve(g.giorno))}</button></td>
      <td class="text-right mono">${g.kcal == null ? '<span class="text-muted">—</span>' : fmtKcal(g.kcal)}</td>
      <td class="text-right mono text-muted">${fmtKcal(g.target)}</td>
      <td class="text-right mono ${scarto == null ? '' : scarto > 0 ? 'neg' : 'pos'}">${scarto == null ? '—' : (scarto > 0 ? '+' : '') + fmtKcal(scarto)}</td>
      <td class="text-right mono text-muted">${g.peso == null ? '—' : fmtKg(g.peso)}</td>
    </tr>`;
  });
  h += '</tbody></table></div></div>';

  setHtml('view-andamento', h);
  disegnaAndamento(gg);
}

function disegnaAndamento(gg) {
  const etichette = gg.map(g => fmtDataBreve(g.giorno));
  drawChart('ch-kcal', {
    type: 'bar',
    data: {
      labels: etichette,
      datasets: [
        {
          label: 'Mangiate', type: 'bar', data: gg.map(g => g.kcal == null ? null : Math.round(g.kcal)),
          // Verde entro il target, rosso sopra: il colore dice il verdetto senza doverlo cercare
          // confrontando la colonna con la linea.
          backgroundColor: gg.map(g => (g.target != null && g.kcal != null && g.kcal > g.target) ? '#dc262690' : '#16a34a90'),
          borderColor: gg.map(g => (g.target != null && g.kcal != null && g.kcal > g.target) ? '#dc2626' : '#16a34a'),
          borderWidth: 1.5, order: 2,
        },
        {
          label: 'Target', type: 'line', data: gg.map(g => g.target == null ? null : Math.round(g.target)),
          borderColor: '#1e2b1e', borderWidth: 2, pointRadius: 0, tension: .2, spanGaps: true, order: 1,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: "'DM Sans'", size: 11 }, boxWidth: 11 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtKcal(c.parsed.y)} kcal` } },
      },
      scales: { y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('it-IT') } } },
    },
  });

  if (!gg.some(g => g.peso != null)) return;
  drawChart('ch-peso', {
    type: 'line',
    data: {
      labels: etichette,
      datasets: [
        { label: 'Peso', data: gg.map(g => g.peso), borderColor: '#16a34a', backgroundColor: '#16a34a20',
          borderWidth: 2.5, pointRadius: 2, tension: .25, spanGaps: true, fill: true },
        { label: 'Piano', data: gg.map(g => g.pesoPiano), borderColor: '#64756b', borderWidth: 2,
          borderDash: [5, 4], pointRadius: 0, tension: .1, spanGaps: true },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: "'DM Sans'", size: 11 }, boxWidth: 11 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtKg(c.parsed.y)} kg` } },
      },
      scales: { y: { ticks: { callback: v => fmtKg(v) } } },
    },
  });
}

    </div>
    <div class="hstack gap-8 wrap">

      <button class="btn btn-primary btn-sm" data-action="nuovo-alimento">➕ Nuovo alimento</button>

/* Quel che il catalogo non ha: si va a cercarlo su Open Food Facts e da lì si aggiunge con un
   tocco. È la stessa banca dati che il diario consulta quando si segna un alimento — la
   differenza è solo il momento: lì l'alimento entra in archivio insieme alla riga del diario,
   qui si mette in dispensa prima di mangiarlo. */
function renderRisultatiOff() {
  const { q, risultati, stato } = S.cercaOff;
  const cercato = (S.cercaAlimenti || '').trim();
  if (cercato.length < 3) return '';
  if (stato === 'cerco') {
    return `<div class="search-note mt-12">🔎 Cerco «${esc(cercato)}» su Open Food Facts…</div>`;
  }
  if (q !== cercato) return '';
  if (!risultati.length) {
    return `<div class="search-note mt-12">${esc(stato || 'Open Food Facts non ha «' + cercato + '».')}
      Puoi scriverlo a mano con <strong>➕ Nuovo alimento</strong>.</div>`;
  }
  return `<div class="card-title mt-16">🌐 Su Open Food Facts <span class="text-muted text-xs">— non ancora nel tuo catalogo</span></div>
    <div class="search-results">
      ${risultati.map((a, i) => `<div class="search-row" style="cursor:default">
        <span class="grow">
          <span class="fw-600">${esc(a.name)}</span>${a.brand ? '<span class="text-muted text-xs"> · ' + esc(a.brand) + '</span>' : ''}
          <span class="food-sub">${fmtKcal(a.kcal_100g)} kcal · grassi ${fmtG(a.fat_100g)} g · zuccheri ${fmtG(a.sugars_100g)} g per 100 g</span>
        </span>
        <button class="btn btn-outline btn-sm" data-action="aggiungi-al-catalogo" data-off="${i}">➕ Aggiungi</button>
      </div>`).join('')}
    </div>`;
}

// La ricerca in rete aspetta la pausa di digitazione: Open Food Facts limita le ricerche
// testuali a una decina al minuto, e a ogni tasto premuto si fa bandire l'indirizzo IP.
function cercaOffCatalogo(q) {
  const ql = (q || '').trim();
  clearTimeout(window._timerOff);
  if (ql.length < 3) { S.cercaOff = { q: '', risultati: [], stato: '' }; return; }
  S.cercaOff = { q: '', risultati: [], stato: 'cerco' };
  renderAlimenti();
  window._timerOff = setTimeout(async () => {
    let ris = [], stato = '';
    try {
      // Quel che è già in catalogo non si ripropone: sarebbe la stessa cosa due volte, e la
      // seconda senza id. Il confronto è sul codice a barre, che è l'unica identità certa.
      const noti = new Set(S.foods.map(f => f.barcode).filter(Boolean));
      const nomi = new Set(S.foods.map(f => (f.name || '').toLowerCase()));
      const d = await cercaOnline({ q: ql });
      ris = d.alimenti
        .filter(a => (!a.barcode || !noti.has(a.barcode)) && !nomi.has(a.name.toLowerCase()))
        .slice(0, 12);
      if (!ris.length) stato = riassumiEsiti(d.esiti) || 'Nessun risultato.';
    } catch (err) {
      stato = 'La ricerca non ha funzionato: ' + err.message;
    }
    if ((S.cercaAlimenti || '').trim() !== ql) return;   // nel frattempo si è scritto altro
    S.cercaOff = { q: ql, risultati: ris, stato };
    renderAlimenti();
    const i = document.querySelector('[data-action="cerca-alimenti"]');
    if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }, RITARDO_RICERCA);
}

/* ═══════════════════════════════════════════════════════════════
   IMPORTARE UNA TABELLA DI COMPOSIZIONE (CREA e simili)
   ═══════════════════════════════════════════════════════════════ */

/* Le tabelle del CREA — il riferimento italiano per gli alimenti che un codice a barre non ce
   l'hanno — non hanno un'API: si consultano dal loro sito e si scaricano come foglio. Questo
   import prende quel foglio e ne fa righe di `al_foods` con `source = 'base'`.

   ⚠️ Le colonne si riconoscono dalle INTESTAZIONI, non dalla posizione: un foglio di
   composizione ha decine di colonne (minerali, vitamine, singoli acidi grassi) in un ordine che
   cambia da edizione a edizione, e leggere «la terza colonna» è il modo di importare il fosforo
   al posto dei grassi senza che nessuno se ne accorga. Quel che non si riconosce si scarta, e
   l'anteprima dice quali colonne ha usato — così una tabella con nomi diversi si vede subito,
   invece di entrare mezza vuota. */
let _xlsxPromise = null;
function caricaXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!_xlsxPromise) {
    _xlsxPromise = new Promise((ok, ko) => {
      const el = document.createElement('script');
      el.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      el.onload = () => ok(window.XLSX);
      el.onerror = () => ko(new Error('Non riesco a caricare il lettore di fogli di calcolo'));
      document.head.appendChild(el);
    });
  }
  return _xlsxPromise;
}

// I sinonimi delle colonne. L'ordine conta: la prima che aggancia vince, quindi le forme più
// specifiche («carboidrati disponibili») stanno prima di quelle generiche («carboidrati»).
const COLONNE_TABELLA = [
  { campo: 'name',          etichetta: 'Alimento',        sin: ['alimento', 'nome', 'descrizione', 'denominazione', 'food', 'prodotto'] },
  { campo: 'kcal_100g',     etichetta: 'Energia (kcal)',  sin: ['energia kcal', 'kcal', 'energia (kcal)', 'calorie', 'energy kcal'] },
  { campo: '_kj',           etichetta: 'Energia (kJ)',    sin: ['energia kj', 'kj', 'energia (kj)', 'energy kj'] },
  { campo: 'proteins_100g', etichetta: 'Proteine',        sin: ['proteine totali', 'proteine', 'protein'] },
  { campo: 'sat_fat_100g',  etichetta: 'Grassi saturi',   sin: ['acidi grassi saturi', 'grassi saturi', 'saturi', 'ag saturi', 'saturated'] },
  { campo: 'fat_100g',      etichetta: 'Grassi',          sin: ['lipidi totali', 'lipidi', 'grassi totali', 'grassi', 'fat'] },
  { campo: 'sugars_100g',   etichetta: 'Zuccheri',        sin: ['zuccheri solubili', 'zuccheri', 'sugars'] },
  { campo: 'carbs_100g',    etichetta: 'Carboidrati',     sin: ['carboidrati disponibili', 'carboidrati', 'glucidi', 'carbohydrates'] },
  { campo: 'fiber_100g',    etichetta: 'Fibra',           sin: ['fibra totale', 'fibra alimentare', 'fibra', 'fibre'] },
  { campo: 'salt_100g',     etichetta: 'Sale',            sin: ['sale', 'salt', 'nacl'] },
  { campo: '_sodio_mg',     etichetta: 'Sodio (mg)',      sin: ['sodio', 'sodium', 'na'] },
];

// ⚠️ Le parentesi NON si buttano via: «Energia (kcal)» e «Energia (kJ)» si distinguono solo per
// quello che c'è dentro, e togliendole diventano la stessa intestazione — l'energia finiva letta
// in kJ come se fossero kcal, cioè un alimento con quattro volte le calorie che ha. Si
// appiattisce tutto a lettere, cifre e spazi, e l'unità resta parte del nome: «energia kcal».
const normIntestazione = v => String(v ?? '')
  .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').trim();

/* Un numero di una tabella di composizione. ⚠️ «tr» (tracce) e «-» NON sono zero: sono «non
   misurato» e «assente dal dato», e tornano null — è la stessa regola della casella vuota che
   vale in tutta l'app. Uno zero falso farebbe sembrare senza grassi un alimento di cui non si
   sa niente. */
function numeroTabella(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const t = String(v ?? '').trim().toLowerCase();
  if (!t || t === 'tr' || t === 'tracce' || t === '-' || t === '–' || t === 'n.d.' || t === 'nd') return null;
  const pulito = t.replace(/[^0-9,.\-]/g, '');
  const c = pulito.lastIndexOf(','), p = pulito.lastIndexOf('.');
  const n = parseFloat(c > p ? pulito.replace(/\./g, '').replace(',', '.') : pulito.replace(/,/g, ''));
  return isNaN(n) ? null : n;
}

/* Trova la riga di intestazione e la mappa colonna → campo. Si guardano le prime 40 righe di
   ogni foglio: una tabella pubblicata ha quasi sempre un titolo, una nota sulla fonte e qualche
   riga vuota prima delle intestazioni vere. Vince la riga che riconosce più colonne, e deve
   averne almeno il nome e l'energia — senza quelle due non è una tabella di alimenti. */
function mappaColonne(righe) {
  let best = null;
  righe.slice(0, 40).forEach((riga, i) => {
    const mappa = {};
    (riga || []).forEach((cella, col) => {
      const t = normIntestazione(cella);
      if (!t) return;
      for (const c of COLONNE_TABELLA) {
        if (mappa[c.campo] != null) continue;
        if (c.sin.some(sn => t === sn || t.startsWith(sn + ' ') || t === sn.replace(/ /g, ''))) { mappa[c.campo] = col; break; }
      }
    });
    const quante = Object.keys(mappa).length;
    const utile = mappa.name != null && (mappa.kcal_100g != null || mappa._kj != null);
    if (utile && (!best || quante > best.quante)) best = { riga: i, mappa, quante };
  });
  return best;
}

function leggiTabella(righe, best) {
  const { mappa } = best;
  const out = [];
  for (let i = best.riga + 1; i < righe.length; i++) {
    const r = righe[i] || [];
    const nome = String(r[mappa.name] ?? '').trim();
    if (!nome || nome.length < 2) continue;
    let kcal = mappa.kcal_100g != null ? numeroTabella(r[mappa.kcal_100g]) : null;
    if (kcal == null && mappa._kj != null) {
      const kj = numeroTabella(r[mappa._kj]);
      if (kj != null) kcal = Math.round(kj / 4.184 * 10) / 10;
    }
    // Senza calorie la riga non serve a niente: è quasi sempre un sottotitolo di sezione
    // («CARNI», «LATTE E DERIVATI») rimasto in mezzo ai dati.
    if (kcal == null) continue;
    const v = campo => mappa[campo] != null ? numeroTabella(r[mappa[campo]]) : null;
    let sale = v('salt_100g');
    if (sale == null) {
      // Le tabelle di composizione danno il SODIO in mg. Il sale dell'etichetta europea è
      // sodio × 2,5: senza la conversione un alimento sembrerebbe salatissimo (numeri in mg
      // letti come grammi) o insipido, a seconda di come lo si guarda.
      const sodio = v('_sodio_mg');
      if (sodio != null) sale = Math.round(sodio / 1000 * 2.5 * 1000) / 1000;
    }
    out.push({
      name: nome, kcal_100g: kcal, proteins_100g: v('proteins_100g'), fat_100g: v('fat_100g'),
      sat_fat_100g: v('sat_fat_100g'), carbs_100g: v('carbs_100g'), sugars_100g: v('sugars_100g'),
      fiber_100g: v('fiber_100g'), salt_100g: sale,
    });
  }
  return out;
}

   VISTA: IMPOSTAZIONI

// Le tre voci che cm_profile ammette. 'Altro' è legittimo e il conto lo regge (vedi
// correzioneSesso): quel che non regge è la casella vuota, che non dice quale variante usare.
const SESSI = { M: 'Uomo', F: 'Donna', Altro: 'Altro' };

// «data di nascita, altezza e sesso» invece di «data di nascita, altezza, sesso»: l'elenco si
// legge, non si scandisce.
const elencoIt = v => v.length <= 1 ? (v[0] || '') : v.slice(0, -1).join(', ') + ' e ' + v[v.length - 1];

// La voce di attività più vicina al valore archiviato. Non l'uguaglianza esatta: un decimale che
// passa da PostgREST può tornare arrotondato, e con `===` la tendina si riaprirebbe sulla prima
// voce — cioè cambiando il fattore in silenzio ogni volta che si salva il profilo.
function attivitaScelta(v) {
  const n = +v;
  if (!n || isNaN(n)) return 1.375;
  return ATTIVITA.reduce((a, b) => (Math.abs(b.v - n) < Math.abs(a.v - n) ? b : a)).v;
}

function renderImpostazioni() {
  const p = S.profile || {};
  const oggi = oggiStr();
  const c = calcolaTarget(oggi);
  const ob = S.objective;

  let h = `
  <div class="view-header">
    <div>
      <div class="page-title">⚙️ Impostazioni</div>
      <div class="page-sub">Quel che serve per calcolare il target</div>
    </div>
  </div>`;

  // ── I dati anagrafici: si leggono, non si scrivono ──
  // Stanno in cm_profile, la scheda condivisa con le altre app. Riproporli in un form qui
  // vorrebbe dire due altezze diverse il giorno che una delle due si corregge.
  const mancanti = [
    !p.birth_date && 'data di nascita',
    !p.height_cm && 'altezza',
    !SESSI[p.sex] && 'sesso',
  ].filter(Boolean);

  h += `<div class="card">
    <div class="card-header-row">
      <div class="card-title">I tuoi dati — dal 👤 Profilo di AppSphere</div>
      <a class="btn btn-outline btn-sm" href="/#profilo">✏️ Apri il Profilo</a>
    </div>
    <div class="table-wrap"><table class="table"><tbody>
      <tr><td>Data di nascita</td><td class="text-right mono">${p.birth_date ? esc(fmtDataBreve(p.birth_date)) + '/' + p.birth_date.slice(0, 4) : '<span class="warn">da compilare</span>'}</td></tr>
      <tr><td>Altezza</td><td class="text-right mono">${p.height_cm ? fmtG(p.height_cm) + ' cm' : '<span class="warn">da compilare</span>'}</td></tr>
      <tr><td>Sesso</td><td class="text-right">${SESSI[p.sex] || '<span class="warn">da compilare</span>'}</td></tr>
    </tbody></table></div>
    ${mancanti.length
      ? `<div class="note-box is-warn mt-12">Manca ${esc(elencoIt(mancanti))}: senza, il metabolismo basale non si calcola e il target non esce.
           Si compila in <strong>AppSphere → ☰ → 👤 Profilo</strong>, ed è lo stesso profilo che usano le altre app.</div>`
      : `<div class="note-box mt-12">Questi tre valori si cambiano solo dal Profilo di AppSphere. Qui si leggono:
           un'altezza scritta in due posti diventa due altezze diverse il giorno che se ne corregge una.</div>`}
  </div>`;

  h += `<div class="card">
    <div class="card-title">Attività fisica</div>
    <div class="form-group">
      <select class="form-input form-select" id="p-activity">
        ${ATTIVITA.map(a => `<option value="${a.v}" ${a.v === attivitaScelta(p.activity) ? 'selected' : ''}>${esc(a.label)}</option>`).join('')}
      </select>
      <div class="form-hint">È il solo dato che vive qui: moltiplica il metabolismo basale e dice
        quanto si consuma davvero in una giornata. Nel Profilo di AppSphere non c'è.</div>
    </div>
    <button class="btn btn-primary" data-action="salva-profilo">💾 Salva</button>
  </div>`;

  // ── I pasti della giornata ──
  const attivi = pastiAttivi();
  const usati = new Set(S.logs.map(r => r.meal));
  h += `<div class="card">
    <div class="card-title">🍽️ I pasti della giornata</div>
    <div class="text-sm text-muted mb-16">Spunta i momenti in cui mangi davvero e chiamali come vuoi.
      Il diario mostrerà solo questi, nell'ordine dell'orologio.</div>
    ${PASTI_BASE.map(b => {
      const conf = attivi.find(a => a.id === b.id);
      const haRighe = usati.has(b.id);
      return `<div class="hstack gap-12 mb-8 wrap">
        <label class="hstack gap-8" style="min-width:150px">
          <input type="checkbox" data-pasto-attivo="${b.id}" ${conf ? 'checked' : ''} />
          <span class="text-sm">${esc(b.label)}</span>
        </label>
        <input class="form-input grow" style="min-width:160px" data-pasto-nome="${b.id}"
               value="${esc(conf ? conf.label : b.label)}" placeholder="${esc(b.label)}" />
        ${haRighe ? '<span class="text-xs text-muted">ha righe in archivio</span>' : ''}
      </div>`;
    }).join('')}
    <button class="btn btn-primary mt-8" data-action="salva-pasti">💾 Salva i pasti</button>
    <div class="note-box mt-12">Togliere un pasto <strong>non cancella niente</strong>: le righe già
      segnate lì dentro restano, continuano a contare nel totale della giornata e si vedono marcate
      come «pasto tolto» — sparire dallo schermo restando nel conto sarebbe il modo peggiore di
      nasconderle. I sei momenti sono fissi: per averne un settimo serve una modifica al database.</div>
  </div>`;

  // ── Stima delle calorie: il riepilogo e poi tratto per tratto ──
  h += `<div class="card">
    <div class="card-title">📐 Stima delle calorie</div>`;
  if (!c.ok) {
    h += `<div class="note-box is-warn">Non si può ancora calcolare: ${esc(spiegaMotivo(c.motivo))}.</div>`;
  } else {
    const tratti = stimaTratti();
    const kgTot = (ob && S.milestones.length >= 2)
      ? +S.milestones[0].weight - +S.milestones[S.milestones.length - 1].weight : null;
    const giorniTot = (ob && S.milestones.length >= 2)
      ? giorniFra(S.milestones[0].date, S.milestones[S.milestones.length - 1].date) : null;

    // ── Riepilogo ──
    h += `<div class="table-wrap"><table class="table"><tbody>
      <tr><td>Peso di oggi</td><td class="text-right mono">${fmtKg(c.peso)} kg</td></tr>
      ${c.pesoPiano != null ? `<tr><td>Peso che il piano chiede oggi</td><td class="text-right mono text-muted">${fmtKg(c.pesoPiano)} kg</td></tr>
      <tr><td>Scarto sulla curva</td><td class="text-right mono ${c.scartoKg > 0.05 ? 'neg' : c.scartoKg < -0.05 ? 'pos' : ''}">${c.scartoKg == null ? '—' : (c.scartoKg > 0 ? 'indietro di ' : c.scartoKg < 0 ? 'avanti di ' : '') + fmtKg(Math.abs(c.scartoKg)) + ' kg'}</td></tr>` : ''}
      ${c.pesoFinale != null ? `<tr><td>Peso finale</td><td class="text-right mono">${fmtKg(c.pesoFinale)} kg</td></tr>` : ''}
      ${kgTot != null ? `<tr><td>Kg del piano <span class="text-muted text-xs">(dal primo all'ultimo traguardo, ${giorniTot} giorni)</span></td><td class="text-right mono">${fmtKg(kgTot)} kg</td></tr>` : ''}
      <tr><td>Kg che mancano oggi</td><td class="text-right mono">${c.kgDaPerdere == null ? '—' : fmtKg(c.kgDaPerdere) + ' kg'}</td></tr>
      <tr><td>Giorni che restano</td><td class="text-right mono">${c.giorniRimasti ?? '—'}</td></tr>
      <tr><td>Metabolismo basale oggi <span class="text-muted text-xs">(Mifflin-St Jeor, ${etaAl(oggi) ?? '—'} anni)</span></td><td class="text-right mono">${fmtKcal(c.bmr)} kcal</td></tr>
      <tr><td>Consumo stimato oggi <span class="text-muted text-xs">(× attività ${(+(p.activity || 1.375)).toLocaleString('it-IT')})</span></td><td class="text-right mono">${fmtKcal(c.tdee)} kcal</td></tr>
      <tr><td class="fw-700">Target di oggi</td><td class="text-right mono fw-700">${fmtKcal(c.kcal)} kcal</td></tr>
    </tbody></table></div>`;
    if (c.avvisi.length) h += c.avvisi.map(a => `<div class="note-box is-danger mt-12">⚠️ ${esc(a)}</div>`).join('');

    // ── I tratti, uno per uno ──
    if (tratti.length) {
      /* ⚠️ L'ordine delle colonne è quello di lettura, non quello del conto: sul telefono la
         tabella scorre dentro il suo riquadro, e quel che resta fuori è quel che sta a destra.
         Il TARGET — la risposta per cui questa tabella esiste — viene subito dopo i pesi; ritmo,
         deficit e consumo sono la spiegazione e possono uscire dal bordo. Per la stessa ragione
         kg e giorni non hanno una colonna loro: si ricavano dalle due che li contengono già, e
         stanno lì sotto in piccolo. */
      h += `<div class="card-title mt-16">I tratti del piano</div>
      <div class="table-wrap"><table class="table"><thead><tr>
        <th>Tratto</th><th>Periodo</th><th class="text-right">Peso</th><th class="text-right">Target</th>
        <th class="text-right">Ritmo</th><th class="text-right">Deficit</th><th class="text-right">Consumo</th>
      </tr></thead><tbody>`;
      tratti.forEach(t => {
        // Il tratto in corso si evidenzia, quelli già passati si sbiadiscono: la riga che serve
        // adesso deve trovarsi senza contare le righe.
        const stile = t.corrente ? ' style="background:#f0fdf4"' : t.passato ? ' class="text-muted"' : '';
        h += `<tr${stile}>
          <td class="nowrap">${t.corrente ? '▶ ' : ''}${t.numero}<span class="text-muted">/${tratti.length}</span></td>
          <td class="nowrap"><div class="text-sm">${esc(fmtDataBreve(t.inizio))} → ${esc(fmtDataBreve(t.fine))}</div>
            <div class="text-xs text-muted">${t.giorni} giorni</div></td>
          <td class="text-right nowrap"><div class="mono">${fmtKg(t.pesoInizio)} → ${fmtKg(t.pesoFine)}</div>
            <div class="text-xs text-muted mono">${t.kg > 0 ? '−' : t.kg < 0 ? '+' : ''}${fmtKg(Math.abs(t.kg))} kg</div></td>
          <td class="text-right mono fw-700 nowrap">${fmtKcal(t.target)}</td>
          <td class="text-right mono nowrap">${fmtRitmo(t.kgAlGiorno * 7)} kg/sett</td>
          <td class="text-right mono neg nowrap">${t.deficit > 0 ? '−' + fmtKcal(t.deficit) : fmtKcal(0)}</td>
          <td class="text-right mono text-muted nowrap">${fmtKcal(t.tdee)}</td>
        </tr>`;
      });
      h += `</tbody></table></div>
      <div class="note-box mt-12">Ogni tratto è calcolato sul <strong>peso medio che il piano prevede lì</strong>,
        non su quello di oggi: il metabolismo basale cala col peso, quindi a parità di ritmo l'ultimo tratto
        chiede meno calorie del primo, e usare il peso di oggi darebbe numeri troppo alti verso la fine.
        Sono i valori <strong>se stai sul piano</strong>: il recupero dello scarto non c'è —
        nei tratti futuri sarebbe un'invenzione, perché lo scarto di domani non si conosce.
        Il conto di oggi per intero, recupero compreso, è nel riquadro del 📓 Diario.</div>`;
    } else if (ob) {
      h += `<div class="note-box is-warn mt-12">Il piano ha meno di due traguardi, quindi non ci sono tratti:
        il deficit è la media fino alla fine. Aggiungendo traguardi in «Ti pisasti?» ogni periodo avrà il suo target.</div>`;
    }
  }
  h += '</div>';

  // ── L'obiettivo letto da Ti pisasti? ──
  h += `<div class="card">
    <div class="card-title">L'obiettivo — da «Ti pisasti?»</div>`;
  if (!ob) {
    h += `<div class="note-box is-warn">Nessun obiettivo attivo. Senza, il target è il semplice mantenimento del peso.
      L'obiettivo si crea in <a href="weight-quest.html">⚖️ Ti pisasti?</a> — questa pagina lo legge e basta.</div>`;
  } else {
    const finale = S.milestones.length ? S.milestones[S.milestones.length - 1].weight : ob.end_weight;
    h += `<div class="table-wrap"><table class="table"><tbody>
      <tr><td>Nome</td><td class="text-right">${esc(ob.objective_name || '—')}</td></tr>
      <tr><td>Tipo</td><td class="text-right">${esc(ob.objective_type || 'perdere')}</td></tr>
      <tr><td>Periodo</td><td class="text-right mono">${esc(fmtDataBreve(ob.start_date))} → ${esc(fmtDataBreve(ob.end_date))}</td></tr>
      <tr><td>Peso di partenza → finale</td><td class="text-right mono">${fmtKg(ob.start_weight)} → ${fmtKg(finale)} kg</td></tr>
      <tr><td>Traguardi</td><td class="text-right mono">${S.milestones.length}</td></tr>
    </tbody></table></div>
    <div class="note-box mt-12">Il target segue il <strong>tratto di piano</strong> in cui sei: un obiettivo con i
      traguardi fitti all'inizio chiede molto adesso e poco dopo, e i due periodi hanno due target diversi.
      Sopra c'è il ritmo che il tratto in corso richiede. Al ritmo si somma il <strong>recupero dello scarto</strong>
      sul peso vero, quindi se rimani indietro il target si stringe da sé e se sei avanti si allarga —
      fino al mantenimento, mai oltre. Per cambiarlo si spostano i traguardi in «Ti pisasti?»:
      qui non c'è nessun numero da riscrivere.</div>`;
  }
  h += '</div>';

  // ── Diagnostica di Open Food Facts ──
  // Un servizio esterno che smette di rispondere si vede solo come «non trova niente», che è
  // indistinguibile da «quel prodotto non c'è». Questo riquadro chiede alle due strade cosa
  // rispondono e lo scrive per esteso: è l'unico modo per sapere se il problema è la rete, il
  // servizio o la ricerca.
  h += `<div class="card">
    <div class="card-header-row">
      <div class="card-title">🔌 Banche dati alimenti</div>
      <button class="btn btn-outline btn-sm" data-action="prova-off">Prova la connessione</button>
    </div>
    <div class="text-sm text-muted">Da qui arrivano i prodotti confezionati, attraverso la Edge Function
      <span class="mono">al-food-search</span>. Codice a barre e ricerca per nome passano da due servizi
      diversi e possono rompersi uno per volta.</div>
    <div id="off-esito" class="mt-12"></div>
  </div>`;

  // ── Zona pericolosa ──
  h += `<div class="card card-danger">
    <div class="card-title">Zona pericolosa</div>
    <div class="text-sm text-muted mb-16">Cancella tutte le righe del diario. Alimenti e target congelati restano.</div>
    <button class="btn btn-danger btn-sm" data-action="svuota-diario">🗑 Cancella tutto il diario</button>
  </div>`;

  setHtml('view-impostazioni', h);
}
