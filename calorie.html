          label: 'Mangiate', type: 'bar', data: gg.map(g => g.kcal == null ? null : Math.round(g.kcal)),
          // Verde entro il target, rosso sopra: il colore dice il verdetto senza doverlo cercare
          // confrontando la colonna con la linea.
          backgroundColor: gg.map(g => (g.target != null && g.kcal != null && g.kcal > g.target) ? '#dc262690' : '#16a34a90'),
          borderColor: gg.map(g => (g.target != null && g.kcal != null && g.kcal > g.target) ? '#dc2626' : '#16a34a'),
          borderWidth: 1.5, order: 2,
        },
        {
          label: 'Target', type: 'line', data: gg.map(g => g.target == null ? null : Math.round(g.target)),
          borderColor: '#1e2b1e', borderWidth: 2, pointRadius: 0, tension: .2, spanGaps: true, order: 1,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: "'DM Sans'", size: 11 }, boxWidth: 11 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtKcal(c.parsed.y)} kcal` } },
      },
      scales: { y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('it-IT') } } },
    },
  });

  if (!gg.some(g => g.peso != null)) return;
  drawChart('ch-peso', {
    type: 'line',
    data: {
      labels: etichette,
      datasets: [
        { label: 'Peso', data: gg.map(g => g.peso), borderColor: '#16a34a', backgroundColor: '#16a34a20',
          borderWidth: 2.5, pointRadius: 2, tension: .25, spanGaps: true, fill: true },
        { label: 'Piano', data: gg.map(g => g.pesoPiano), borderColor: '#64756b', borderWidth: 2,
          borderDash: [5, 4], pointRadius: 0, tension: .1, spanGaps: true },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: "'DM Sans'", size: 11 }, boxWidth: 11 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtKg(c.parsed.y)} kg` } },
      },
      scales: { y: { ticks: { callback: v => fmtKg(v) } } },
    },
  });
}

/* ═══════════════════════════════════════════════════════════════
   VISTA: ALIMENTI
   ═══════════════════════════════════════════════════════════════ */

/* ── Da dove viene un alimento ─────────────────────────────────────────────
   ⚠️ La distinzione che conta è UNA: quella voce è già nel tuo catalogo, oppure sta arrivando
   adesso da una banca dati pubblica? Sono due cose diverse da usare — la prima è un dato tuo,
   che hai già guardato e che puoi correggere; la seconda l'ha scritta qualcun altro, può
   mancare, può essere sbagliata, e quando la scegli entra in archivio.

   Fino alla v1.5.0 quella differenza era una parola in coda alla riga dei valori, dopo le
   calorie e con lo stesso grigio: la si leggeva solo andandola a cercare. Ora la porta
   l'**icona in testa alla riga** (📗 catalogo / 🌐 in rete), che è il primo posto dove cade
   l'occhio, e il **colore del badge** la ripete. Il badge dice invece QUALE fonte, che è
   l'informazione di secondo livello.

   ⚠️ Il nome della fonte di rete si legge da `a.source` e non è più scritto a mano: la Edge
   Function `al-food-search` risponde `'off'` o `'usda'`, e la stringa fissa «Open Food Facts»
   attribuiva a Open Food Facts anche i risultati USDA — cioè diceva il falso proprio nel punto
   che esiste per dire da dove viene un numero. */
const FONTI = {
  base:    { icona: '📗', etichetta: 'Catalogo · base', classe: 'base',
             spiega: 'Già nel tuo catalogo — voce generica dalle tabelle di composizione pubbliche' },
  manuale: { icona: '📗', etichetta: 'Catalogo · a mano', classe: 'manuale',
             spiega: 'Già nel tuo catalogo — l\'hai scritto tu' },
  off:     { icona: '📗', etichetta: 'Catalogo · Open Food Facts', classe: 'off',
             spiega: 'Già nel tuo catalogo — arrivato a suo tempo da Open Food Facts' },
  usda:    { icona: '📗', etichetta: 'Catalogo · USDA', classe: 'off',
             spiega: 'Già nel tuo catalogo — arrivato a suo tempo dalla banca dati USDA' },
};
const FONTI_RETE = {
  off:  { icona: '🌐', etichetta: 'In rete · Open Food Facts', classe: 'rete',
          spiega: 'Arriva adesso da Open Food Facts, in tempo reale: non è ancora nel tuo catalogo, ci entra quando lo scegli' },
  usda: { icona: '🌐', etichetta: 'In rete · USDA', classe: 'rete',
          spiega: 'Arriva adesso dalla banca dati USDA, in tempo reale: non è ancora nel tuo catalogo, ci entra quando lo scegli' },
};

/* `inRete` = la riga viene da una banca dati pubblica e non dall'archivio. Una fonte che non si
   conosce non fa sparire l'icona né il badge: si mostra il nome così com'è, perché «viene da una
   fonte che non so nominare» resta un'informazione, mentre una riga muta si legge come «catalogo». */
function fonteDi(a, inRete) {
  const src = (a && a.source) || '';
  if (inRete) {
    return FONTI_RETE[src] || { icona: '🌐', etichetta: 'In rete · ' + (src || 'banca dati pubblica'), classe: 'rete',
      spiega: 'Arriva adesso da una banca dati pubblica: entra nel tuo catalogo quando lo scegli' };
  }
  return FONTI[src] || { icona: '📗', etichetta: 'Catalogo · ' + (src || 'archivio'), classe: 'manuale',
    spiega: 'Già nel tuo catalogo' };
}

/* ⚠️ Quali risultati di rete il catalogo può davvero ospitare. Non è una scelta di gusto: la
   colonna `al_foods.source` ha un CHECK, e una fonte che non è fra i suoi valori non entra in
   archivio: l'insert verrebbe rifiutato dal database. L'elenco qui sotto è quindi lo specchio di
   quel CHECK e va tenuto uguale — `20260830120100_al_foods_source_usda.sql` ci ha aggiunto
   'usda', che prima restava fuori.

   La costante sta qui, in un posto solo, ed è la stessa che decide il messaggio e il
   salvataggio: due condizioni scritte separatamente sono la finestra che promette una cosa e il
   pulsante che ne fa un'altra, il giorno che una delle due cambia. Una fonte non salvabile non è
   un errore — quel prodotto si mangia lo stesso, i valori si copiano sulla riga del diario come
   per ogni altro — ma la finestra della porzione **lo dice** invece di promettere un salvataggio
   che non avverrà. */
const FONTI_SALVABILI = ['off', 'usda'];

const iconaFonte = f => `<span class="fonte-ico" title="${esc(f.spiega)}" aria-hidden="true">${f.icona}</span>`;
const badgeFonte = f => `<span class="badge badge-src-${f.classe}" title="${esc(f.spiega)}">${esc(f.etichetta)}</span>`;

function renderAlimenti() {
  const q = (S.cercaAlimenti || '').trim().toLowerCase();
  const elenco = S.foods.filter(f => !q || (f.name || '').toLowerCase().includes(q) || (f.brand || '').toLowerCase().includes(q));

  let h = `
  <div class="view-header">
    <div>
      <div class="page-title">🍎 Alimenti</div>
      <div class="page-sub">${S.foods.length} in archivio · i valori sono per 100 g</div>
    </div>
    <div class="hstack gap-8 wrap">
      <button class="btn btn-outline btn-sm" data-action="importa-tabella">📄 Importa una tabella</button>
      <button class="btn btn-primary btn-sm" data-action="nuovo-alimento">➕ Nuovo alimento</button>
    </div>
  </div>`;

  const scanner = ('BarcodeDetector' in window);
  h += `<div class="card">
    <div class="hstack gap-8">
      <input type="search" class="form-input grow" data-action="cerca-alimenti" placeholder="Cerca un alimento — se non ce l'hai lo cerco in rete…" value="${esc(S.cercaAlimenti)}" />
      <button class="btn btn-outline btn-sm" data-action="${scanner ? 'apri-scanner-cat' : 'barcode-catalogo'}" title="Codice a barre">📷</button>
    </div>
    <div id="scanner-wrap"><video id="scanner-video" playsinline muted></video>
      <div class="text-xs text-muted mt-8">Inquadra il codice a barre. <button class="btn-icon" data-action="chiudi-scanner">chiudi</button></div>
    </div>
    <div class="table-wrap mt-12">
      <table class="table"><thead><tr>
        <th></th><th></th><th>Alimento</th><th class="text-right">kcal</th><th class="text-right">Grassi</th>
        <th class="text-right">Zuccheri</th><th class="text-right">Proteine</th><th>Fonte</th>
      </tr></thead><tbody>`;
  if (!elenco.length) {
    h += '<tr><td colspan="8" class="text-center text-muted" style="padding:26px">Nessun alimento.</td></tr>';
  } else {
    elenco.slice(0, 400).forEach(f => {
      const fo = fonteDi(f);
      h += `<tr>
        <td class="nowrap">
          <button class="btn-icon" data-action="modifica-alimento" data-id="${f.id}" title="Modifica">✏️</button>
          <button class="btn-icon btn-icon-danger" data-action="elimina-alimento" data-id="${f.id}" title="Elimina">🗑</button>
        </td>
        <td><button class="btn-icon" data-action="preferito" data-id="${f.id}" title="Preferito">${f.favorite ? '⭐' : '☆'}</button></td>
        <td><div class="fw-600">${esc(f.name)}</div>${f.brand ? '<div class="text-xs text-muted">' + esc(f.brand) + '</div>' : ''}</td>
        <td class="text-right mono">${fmtKcal(f.kcal_100g)}</td>
        <td class="text-right mono text-muted">${fmtG(f.fat_100g)}</td>
        <td class="text-right mono text-muted">${fmtG(f.sugars_100g)}</td>
        <td class="text-right mono text-muted">${fmtG(f.proteins_100g)}</td>
        <td class="nowrap">${iconaFonte(fo)}${badgeFonte(fo)}</td>
      </tr>`;
    });
  }
  h += `</tbody></table></div>
    ${elenco.length > 400 ? '<div class="text-xs text-muted mt-8">Mostrati i primi 400: restringi la ricerca.</div>' : ''}
    ${renderRisultatiOff()}
  </div>
  <div class="note-box">Gli alimenti «base» sono valori indicativi presi dalle tabelle di composizione pubbliche
    (per l'Italia il riferimento è il CREA): dove un numero conta davvero, confrontalo con la tabella e correggilo —
    si modificano come tutti gli altri. I prodotti confezionati arrivano invece dall'etichetta,
    via <strong>Open Food Facts</strong>, e li scrivono i suoi collaboratori: capita che manchino o siano sbagliati.</div>`;

  setHtml('view-alimenti', h);
}

/* Quel che il catalogo non ha: si va a cercarlo su Open Food Facts e da lì si aggiunge con un
   tocco. È la stessa banca dati che il diario consulta quando si segna un alimento — la
   differenza è solo il momento: lì l'alimento entra in archivio insieme alla riga del diario,
   qui si mette in dispensa prima di mangiarlo. */
function renderRisultatiOff() {
  const { q, risultati, stato } = S.cercaOff;
  const cercato = (S.cercaAlimenti || '').trim();
  if (cercato.length < 3) return '';
  if (stato === 'cerco') {
    return `<div class="search-note mt-12">🔎 Cerco «${esc(cercato)}» su Open Food Facts…</div>`;
  }
  if (q !== cercato) return '';
  if (!risultati.length) {
    return `<div class="search-note mt-12">${esc(stato || 'Open Food Facts non ha «' + cercato + '».')}
      Puoi scriverlo a mano con <strong>➕ Nuovo alimento</strong>.</div>`;
  }
  return `<div class="card-title mt-16">🌐 Trovati in rete <span class="text-muted text-xs">— non ancora nel tuo catalogo</span></div>
    <div class="search-results">
      ${risultati.map((a, i) => `<div class="search-row" style="cursor:default">
        ${iconaFonte(fonteDi(a, true))}
        <span class="grow">
          <span class="fw-600">${esc(a.name)}</span>${a.brand ? '<span class="text-muted text-xs"> · ' + esc(a.brand) + '</span>' : ''}
          <span class="food-sub riga-fonte">${badgeFonte(fonteDi(a, true))}<span>${fmtKcal(a.kcal_100g)} kcal · grassi ${fmtG(a.fat_100g)} g · zuccheri ${fmtG(a.sugars_100g)} g per 100 g</span></span>
        </span>
        <button class="btn btn-outline btn-sm" data-action="aggiungi-al-catalogo" data-off="${i}">➕ Aggiungi</button>
      </div>`).join('')}
    </div>`;
}

// La ricerca in rete aspetta la pausa di digitazione: Open Food Facts limita le ricerche
// testuali a una decina al minuto, e a ogni tasto premuto si fa bandire l'indirizzo IP.
function cercaOffCatalogo(q) {
  const ql = (q || '').trim();
  clearTimeout(window._timerOff);
  if (ql.length < 3) { S.cercaOff = { q: '', risultati: [], stato: '' }; return; }
  S.cercaOff = { q: '', risultati: [], stato: 'cerco' };
  renderAlimenti();
  window._timerOff = setTimeout(async () => {
    let ris = [], stato = '';
    try {
      // Quel che è già in catalogo non si ripropone: sarebbe la stessa cosa due volte, e la
      // seconda senza id. Il confronto è sul codice a barre, che è l'unica identità certa.
      const noti = new Set(S.foods.map(f => f.barcode).filter(Boolean));
      const nomi = new Set(S.foods.map(f => (f.name || '').toLowerCase()));
      const d = await cercaOnline({ q: ql });
      ris = d.alimenti
        .filter(a => (!a.barcode || !noti.has(a.barcode)) && !nomi.has(a.name.toLowerCase()))
        .slice(0, 12);
      if (!ris.length) stato = riassumiEsiti(d.esiti) || 'Nessun risultato.';
    } catch (err) {
      stato = 'La ricerca non ha funzionato: ' + err.message;
    }
    if ((S.cercaAlimenti || '').trim() !== ql) return;   // nel frattempo si è scritto altro
    S.cercaOff = { q: ql, risultati: ris, stato };
    renderAlimenti();
    const i = document.querySelector('[data-action="cerca-alimenti"]');
    if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }, RITARDO_RICERCA);
}

/* ═══════════════════════════════════════════════════════════════
   IMPORTARE UNA TABELLA DI COMPOSIZIONE (CREA e simili)
   ═══════════════════════════════════════════════════════════════ */

/* Le tabelle del CREA — il riferimento italiano per gli alimenti che un codice a barre non ce
   l'hanno — non hanno un'API: si consultano dal loro sito e si scaricano come foglio. Questo
   import prende quel foglio e ne fa righe di `al_foods` con `source = 'base'`.

   ⚠️ Le colonne si riconoscono dalle INTESTAZIONI, non dalla posizione: un foglio di
   composizione ha decine di colonne (minerali, vitamine, singoli acidi grassi) in un ordine che
   cambia da edizione a edizione, e leggere «la terza colonna» è il modo di importare il fosforo
   al posto dei grassi senza che nessuno se ne accorga. Quel che non si riconosce si scarta, e
   l'anteprima dice quali colonne ha usato — così una tabella con nomi diversi si vede subito,
   invece di entrare mezza vuota. */
let _xlsxPromise = null;
function caricaXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!_xlsxPromise) {
    _xlsxPromise = new Promise((ok, ko) => {
      const el = document.createElement('script');
      el.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      el.onload = () => ok(window.XLSX);
      el.onerror = () => ko(new Error('Non riesco a caricare il lettore di fogli di calcolo'));
      document.head.appendChild(el);
    });
  }
  return _xlsxPromise;
}

// I sinonimi delle colonne. L'ordine conta: la prima che aggancia vince, quindi le forme più
// specifiche («carboidrati disponibili») stanno prima di quelle generiche («carboidrati»).
const COLONNE_TABELLA = [
  { campo: 'name',          etichetta: 'Alimento',        sin: ['alimento', 'nome', 'descrizione', 'denominazione', 'food', 'prodotto'] },
  { campo: 'kcal_100g',     etichetta: 'Energia (kcal)',  sin: ['energia kcal', 'kcal', 'energia (kcal)', 'calorie', 'energy kcal'] },
  { campo: '_kj',           etichetta: 'Energia (kJ)',    sin: ['energia kj', 'kj', 'energia (kj)', 'energy kj'] },
  { campo: 'proteins_100g', etichetta: 'Proteine',        sin: ['proteine totali', 'proteine', 'protein'] },
  { campo: 'sat_fat_100g',  etichetta: 'Grassi saturi',   sin: ['acidi grassi saturi', 'grassi saturi', 'saturi', 'ag saturi', 'saturated'] },
  { campo: 'fat_100g',      etichetta: 'Grassi',          sin: ['lipidi totali', 'lipidi', 'grassi totali', 'grassi', 'fat'] },
  { campo: 'sugars_100g',   etichetta: 'Zuccheri',        sin: ['zuccheri solubili', 'zuccheri', 'sugars'] },
  { campo: 'carbs_100g',    etichetta: 'Carboidrati',     sin: ['carboidrati disponibili', 'carboidrati', 'glucidi', 'carbohydrates'] },
  { campo: 'fiber_100g',    etichetta: 'Fibra',           sin: ['fibra totale', 'fibra alimentare', 'fibra', 'fibre'] },
  { campo: 'salt_100g',     etichetta: 'Sale',            sin: ['sale', 'salt', 'nacl'] },
  { campo: '_sodio_mg',     etichetta: 'Sodio (mg)',      sin: ['sodio', 'sodium', 'na'] },
];

// ⚠️ Le parentesi NON si buttano via: «Energia (kcal)» e «Energia (kJ)» si distinguono solo per
// quello che c'è dentro, e togliendole diventano la stessa intestazione — l'energia finiva letta
// in kJ come se fossero kcal, cioè un alimento con quattro volte le calorie che ha. Si
// appiattisce tutto a lettere, cifre e spazi, e l'unità resta parte del nome: «energia kcal».
const normIntestazione = v => String(v ?? '')
  .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').trim();

/* Un numero di una tabella di composizione. ⚠️ «tr» (tracce) e «-» NON sono zero: sono «non
   misurato» e «assente dal dato», e tornano null — è la stessa regola della casella vuota che
   vale in tutta l'app. Uno zero falso farebbe sembrare senza grassi un alimento di cui non si
   sa niente. */
function numeroTabella(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const t = String(v ?? '').trim().toLowerCase();
  if (!t || t === 'tr' || t === 'tracce' || t === '-' || t === '–' || t === 'n.d.' || t === 'nd') return null;
  const pulito = t.replace(/[^0-9,.\-]/g, '');
  const c = pulito.lastIndexOf(','), p = pulito.lastIndexOf('.');
  const n = parseFloat(c > p ? pulito.replace(/\./g, '').replace(',', '.') : pulito.replace(/,/g, ''));
  return isNaN(n) ? null : n;
}

/* Trova la riga di intestazione e la mappa colonna → campo. Si guardano le prime 40 righe di
   ogni foglio: una tabella pubblicata ha quasi sempre un titolo, una nota sulla fonte e qualche
   riga vuota prima delle intestazioni vere. Vince la riga che riconosce più colonne, e deve
   averne almeno il nome e l'energia — senza quelle due non è una tabella di alimenti. */
function mappaColonne(righe) {
  let best = null;
  righe.slice(0, 40).forEach((riga, i) => {
    const mappa = {};
    (riga || []).forEach((cella, col) => {
      const t = normIntestazione(cella);
      if (!t) return;
      for (const c of COLONNE_TABELLA) {
        if (mappa[c.campo] != null) continue;
        if (c.sin.some(sn => t === sn || t.startsWith(sn + ' ') || t === sn.replace(/ /g, ''))) { mappa[c.campo] = col; break; }
      }
    });
    const quante = Object.keys(mappa).length;
    const utile = mappa.name != null && (mappa.kcal_100g != null || mappa._kj != null);
    if (utile && (!best || quante > best.quante)) best = { riga: i, mappa, quante };
  });
  return best;
}

function leggiTabella(righe, best) {
  const { mappa } = best;
  const out = [];
  for (let i = best.riga + 1; i < righe.length; i++) {
    const r = righe[i] || [];
    const nome = String(r[mappa.name] ?? '').trim();
    if (!nome || nome.length < 2) continue;
    let kcal = mappa.kcal_100g != null ? numeroTabella(r[mappa.kcal_100g]) : null;
    if (kcal == null && mappa._kj != null) {
      const kj = numeroTabella(r[mappa._kj]);
      if (kj != null) kcal = Math.round(kj / 4.184 * 10) / 10;
    }
    // Senza calorie la riga non serve a niente: è quasi sempre un sottotitolo di sezione
    // («CARNI», «LATTE E DERIVATI») rimasto in mezzo ai dati.
    if (kcal == null) continue;
    const v = campo => mappa[campo] != null ? numeroTabella(r[mappa[campo]]) : null;
    let sale = v('salt_100g');
    if (sale == null) {
      // Le tabelle di composizione danno il SODIO in mg. Il sale dell'etichetta europea è
      // sodio × 2,5: senza la conversione un alimento sembrerebbe salatissimo (numeri in mg
      // letti come grammi) o insipido, a seconda di come lo si guarda.
      const sodio = v('_sodio_mg');
      if (sodio != null) sale = Math.round(sodio / 1000 * 2.5 * 1000) / 1000;
    }
    out.push({
      name: nome, kcal_100g: kcal, proteins_100g: v('proteins_100g'), fat_100g: v('fat_100g'),
      sat_fat_100g: v('sat_fat_100g'), carbs_100g: v('carbs_100g'), sugars_100g: v('sugars_100g'),
      fiber_100g: v('fiber_100g'), salt_100g: sale,
    });
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   VISTA: IMPOSTAZIONI
   ═══════════════════════════════════════════════════════════════ */

// Le tre voci che cm_profile ammette. 'Altro' è legittimo e il conto lo regge (vedi
// correzioneSesso): quel che non regge è la casella vuota, che non dice quale variante usare.
const SESSI = { M: 'Uomo', F: 'Donna', Altro: 'Altro' };

// «data di nascita, altezza e sesso» invece di «data di nascita, altezza, sesso»: l'elenco si
// legge, non si scandisce.
const elencoIt = v => v.length <= 1 ? (v[0] || '') : v.slice(0, -1).join(', ') + ' e ' + v[v.length - 1];

// La voce di attività più vicina al valore archiviato. Non l'uguaglianza esatta: un decimale che
// passa da PostgREST può tornare arrotondato, e con `===` la tendina si riaprirebbe sulla prima
// voce — cioè cambiando il fattore in silenzio ogni volta che si salva il profilo.
function attivitaScelta(v) {
  const n = +v;
  if (!n || isNaN(n)) return 1.375;
  return ATTIVITA.reduce((a, b) => (Math.abs(b.v - n) < Math.abs(a.v - n) ? b : a)).v;
}

function renderImpostazioni() {
  const p = S.profile || {};
  const oggi = oggiStr();
  const c = calcolaTarget(oggi);
  const ob = S.objective;

  let h = `
  <div class="view-header">
    <div>
      <div class="page-title">⚙️ Impostazioni</div>
      <div class="page-sub">Quel che serve per calcolare il target</div>
    </div>
  </div>`;

  // ── I dati anagrafici: si leggono, non si scrivono ──
  // Stanno in cm_profile, la scheda condivisa con le altre app. Riproporli in un form qui
  // vorrebbe dire due altezze diverse il giorno che una delle due si corregge.
  const mancanti = [
    !p.birth_date && 'data di nascita',
    !p.height_cm && 'altezza',
    !SESSI[p.sex] && 'sesso',
  ].filter(Boolean);

  h += `<div class="card">
    <div class="card-header-row">
      <div class="card-title">I tuoi dati — dal 👤 Profilo di AppSphere</div>
      <a class="btn btn-outline btn-sm" href="/#profilo">✏️ Apri il Profilo</a>
    </div>
    <div class="table-wrap"><table class="table"><tbody>
      <tr><td>Data di nascita</td><td class="text-right mono">${p.birth_date ? esc(fmtDataBreve(p.birth_date)) + '/' + p.birth_date.slice(0, 4) : '<span class="warn">da compilare</span>'}</td></tr>
      <tr><td>Altezza</td><td class="text-right mono">${p.height_cm ? fmtG(p.height_cm) + ' cm' : '<span class="warn">da compilare</span>'}</td></tr>
      <tr><td>Sesso</td><td class="text-right">${SESSI[p.sex] || '<span class="warn">da compilare</span>'}</td></tr>
    </tbody></table></div>
    ${mancanti.length
      ? `<div class="note-box is-warn mt-12">Manca ${esc(elencoIt(mancanti))}: senza, il metabolismo basale non si calcola e il target non esce.
           Si compila in <strong>AppSphere → ☰ → 👤 Profilo</strong>, ed è lo stesso profilo che usano le altre app.</div>`
      : `<div class="note-box mt-12">Questi tre valori si cambiano solo dal Profilo di AppSphere. Qui si leggono:
           un'altezza scritta in due posti diventa due altezze diverse il giorno che se ne corregge una.</div>`}
  </div>`;

  h += `<div class="card">
    <div class="card-title">Attività fisica</div>
    <div class="form-group">
      <select class="form-input form-select" id="p-activity">
        ${ATTIVITA.map(a => `<option value="${a.v}" ${a.v === attivitaScelta(p.activity) ? 'selected' : ''}>${esc(a.label)}</option>`).join('')}
      </select>
      <div class="form-hint">È il solo dato che vive qui: moltiplica il metabolismo basale e dice
        quanto si consuma davvero in una giornata. Nel Profilo di AppSphere non c'è.</div>
    </div>
    <button class="btn btn-primary" data-action="salva-profilo">💾 Salva</button>
  </div>`;

  // ── I pasti della giornata ──
  const attivi = pastiAttivi();
  const usati = new Set(S.logs.map(r => r.meal));
  h += `<div class="card">
    <div class="card-title">🍽️ I pasti della giornata</div>
    <div class="text-sm text-muted mb-16">Spunta i momenti in cui mangi davvero e chiamali come vuoi.
      Il diario mostrerà solo questi, nell'ordine dell'orologio.</div>
    ${PASTI_BASE.map(b => {
      const conf = attivi.find(a => a.id === b.id);
      const haRighe = usati.has(b.id);
      return `<div class="hstack gap-12 mb-8 wrap">
        <label class="hstack gap-8" style="min-width:150px">

               value="${esc(conf ? conf.label : b.label)}" placeholder="${esc(b.label)}" />
        ${haRighe ? '<span class="text-xs text-muted">ha righe in archivio</span>' : ''}
      </div>`;
    }).join('')}
    <button class="btn btn-primary mt-8" data-action="salva-pasti">💾 Salva i pasti</button>
    <div class="note-box mt-12">Togliere un pasto <strong>non cancella niente</strong>: le righe già
      segnate lì dentro restano, continuano a contare nel totale della giornata e si vedono marcate
      come «pasto tolto» — sparire dallo schermo restando nel conto sarebbe il modo peggiore di
      nasconderle. I sei momenti sono fissi: per averne un settimo serve una modifica al database.</div>
  </div>`;

  // ── Stima delle calorie: il riepilogo e poi tratto per tratto ──
  h += `<div class="card">
    <div class="card-title">📐 Stima delle calorie</div>`;
  if (!c.ok) {
    h += `<div class="note-box is-warn">Non si può ancora calcolare: ${esc(spiegaMotivo(c.motivo))}.</div>`;
  } else {
    const tratti = stimaTratti();
    const kgTot = (ob && S.milestones.length >= 2)
      ? +S.milestones[0].weight - +S.milestones[S.milestones.length - 1].weight : null;
    const giorniTot = (ob && S.milestones.length >= 2)
      ? giorniFra(S.milestones[0].date, S.milestones[S.milestones.length - 1].date) : null;

    // ── Riepilogo ──
    h += `<div class="table-wrap"><table class="table"><tbody>
      <tr><td>Peso di oggi</td><td class="text-right mono">${fmtKg(c.peso)} kg</td></tr>
      ${c.pesoPiano != null ? `<tr><td>Peso che il piano chiede oggi</td><td class="text-right mono text-muted">${fmtKg(c.pesoPiano)} kg</td></tr>
      <tr><td>Scarto sulla curva</td><td class="text-right mono ${c.scartoKg > 0.05 ? 'neg' : c.scartoKg < -0.05 ? 'pos' : ''}">${c.scartoKg == null ? '—' : (c.scartoKg > 0 ? 'indietro di ' : c.scartoKg < 0 ? 'avanti di ' : '') + fmtKg(Math.abs(c.scartoKg)) + ' kg'}</td></tr>` : ''}
      ${c.pesoFinale != null ? `<tr><td>Peso finale</td><td class="text-right mono">${fmtKg(c.pesoFinale)} kg</td></tr>` : ''}
      ${kgTot != null ? `<tr><td>Kg del piano <span class="text-muted text-xs">(dal primo all'ultimo traguardo, ${giorniTot} giorni)</span></td><td class="text-right mono">${fmtKg(kgTot)} kg</td></tr>` : ''}
      <tr><td>Kg che mancano oggi</td><td class="text-right mono">${c.kgDaPerdere == null ? '—' : fmtKg(c.kgDaPerdere) + ' kg'}</td></tr>
      <tr><td>Giorni che restano</td><td class="text-right mono">${c.giorniRimasti ?? '—'}</td></tr>
      <tr><td>Metabolismo basale oggi <span class="text-muted text-xs">(Mifflin-St Jeor, ${etaAl(oggi) ?? '—'} anni)</span></td><td class="text-right mono">${fmtKcal(c.bmr)} kcal</td></tr>
      <tr><td>Consumo stimato oggi <span class="text-muted text-xs">(× attività ${(+(p.activity || 1.375)).toLocaleString('it-IT')})</span></td><td class="text-right mono">${fmtKcal(c.tdee)} kcal</td></tr>
      <tr><td class="fw-700">Target di oggi</td><td class="text-right mono fw-700">${fmtKcal(c.kcal)} kcal</td></tr>
    </tbody></table></div>`;
    if (c.avvisi.length) h += c.avvisi.map(a => `<div class="note-box is-danger mt-12">⚠️ ${esc(a)}</div>`).join('');

    // ── I tratti, uno per uno ──
    if (tratti.length) {
      /* ⚠️ L'ordine delle colonne è quello di lettura, non quello del conto: sul telefono la
         tabella scorre dentro il suo riquadro, e quel che resta fuori è quel che sta a destra.
         Il TARGET — la risposta per cui questa tabella esiste — viene subito dopo i pesi; ritmo,
         deficit e consumo sono la spiegazione e possono uscire dal bordo. Per la stessa ragione
         kg e giorni non hanno una colonna loro: si ricavano dalle due che li contengono già, e
         stanno lì sotto in piccolo. */
      h += '<div class="card-title mt-16">I tratti del piano</div>' + tabellaTratti(tratti);
    } else if (ob) {
      h += `<div class="note-box is-warn mt-12">Il piano ha meno di due traguardi, quindi non ci sono tratti:
        il deficit è la media fino alla fine. Aggiungendo traguardi in «Ti pisasti?» ogni periodo avrà il suo target.</div>`;
    }
  }
  h += '</div>';

  // ── L'obiettivo letto da Ti pisasti? ──
  h += `<div class="card">
    <div class="card-title">L'obiettivo — da «Ti pisasti?»</div>`;
  if (!ob) {
    h += `<div class="note-box is-warn">Nessun obiettivo attivo. Senza, il target è il semplice mantenimento del peso.
      L'obiettivo si crea in <a href="weight-quest.html">⚖️ Ti pisasti?</a> — questa pagina lo legge e basta.</div>`;
  } else {
    const finale = S.milestones.length ? S.milestones[S.milestones.length - 1].weight : ob.end_weight;
    h += `<div class="table-wrap"><table class="table"><tbody>
      <tr><td>Nome</td><td class="text-right">${esc(ob.objective_name || '—')}</td></tr>
      <tr><td>Tipo</td><td class="text-right">${esc(ob.objective_type || 'perdere')}</td></tr>
      <tr><td>Periodo</td><td class="text-right mono">${esc(fmtDataBreve(ob.start_date))} → ${esc(fmtDataBreve(ob.end_date))}</td></tr>
      <tr><td>Peso di partenza → finale</td><td class="text-right mono">${fmtKg(ob.start_weight)} → ${fmtKg(finale)} kg</td></tr>
      <tr><td>Traguardi</td><td class="text-right mono">${S.milestones.length}</td></tr>
    </tbody></table></div>
    <div class="note-box mt-12">Il target segue il <strong>tratto di piano</strong> in cui sei: un obiettivo con i
      traguardi fitti all'inizio chiede molto adesso e poco dopo, e i due periodi hanno due target diversi.
      Sopra c'è il ritmo che il tratto in corso richiede. Al ritmo si somma il <strong>recupero dello scarto</strong>
      sul peso vero, quindi se rimani indietro il target si stringe da sé e se sei avanti si allarga —
      fino al mantenimento, mai oltre. Per cambiarlo si spostano i traguardi in «Ti pisasti?»:
      qui non c'è nessun numero da riscrivere.</div>`;
  }
  h += '</div>';

  // ── Diagnostica di Open Food Facts ──
  // Un servizio esterno che smette di rispondere si vede solo come «non trova niente», che è
  // indistinguibile da «quel prodotto non c'è». Questo riquadro chiede alle due strade cosa
  // rispondono e lo scrive per esteso: è l'unico modo per sapere se il problema è la rete, il
  // servizio o la ricerca.
  h += `<div class="card">
    <div class="card-header-row">
      <div class="card-title">🔌 Banche dati alimenti</div>
      <button class="btn btn-outline btn-sm" data-action="prova-off">Prova la connessione</button>
    </div>
    <div class="text-sm text-muted">Da qui arrivano i prodotti confezionati, attraverso la Edge Function
      <span class="mono">al-food-search</span>. Codice a barre e ricerca per nome passano da due servizi
      diversi e possono rompersi uno per volta.</div>
    <div id="off-esito" class="mt-12"></div>
  </div>`;

  // ── Zona pericolosa ──
  h += `<div class="card card-danger">
    <div class="card-title">Zona pericolosa</div>
    <div class="text-sm text-muted mb-16">Cancella tutte le righe del diario. Alimenti e target congelati restano.</div>
    <button class="btn btn-danger btn-sm" data-action="svuota-diario">🗑 Cancella tutto il diario</button>
  </div>`;

  setHtml('view-impostazioni', h);
}

/* ── Aggiungi un alimento al diario ────────────────────────────
   Una finestra sola per le due strade — «ce l'ho già» e «è un prodotto del supermercato» —
   perché quel che si fa dopo averlo trovato non cambia: grammi, e via. */
function openAggiungi(meal) {
  S.ricerca = { q: '', locali: [], off: [], stato: '' };
  const scanner = ('BarcodeDetector' in window);
  openModal('Aggiungi un alimento', `
    <div class="form-group">
      <label class="form-label" for="add-meal">Pasto</label>
      <select class="form-input form-select" id="add-meal">

        <button class="btn btn-outline btn-sm" data-action="${scanner ? 'apri-scanner' : 'barcode-a-mano'}" title="Codice a barre">📷</button>
      </div>

        i prodotti confezionati su Open Food Facts.</div>

    </div>
    <div id="add-results"></div>
  `);
  setTimeout(() => $('add-q')?.focus(), 50);

function renderRisultati() {
  const { q, locali, off, stato } = S.ricerca;
  let h = '';
  if (!q) {
    // A campo vuoto si propongono i preferiti e i più usati: nove volte su dieci quel che si sta
    // per segnare è già lì, e cercarlo sarebbe scrivere per niente.
    const prop = S.foods.slice(0, 12);
    if (prop.length) {
      h += '<div class="search-results">'
         + '<div class="search-group">📗 Nel tuo catalogo<span class="sg-nota">— preferiti e più usati</span></div>'
         + prop.map(a => rigaRisultato(a)).join('') + '</div>';
      h += '<div class="search-note">Scrivi per cercare fra i tuoi alimenti e in rete.</div>';
    }
  } else {
    // ⚠️ Le due provenienze vanno sotto due intestazioni, non concatenate. Una fila unica in cui
    // il catalogo sfuma nella rete senza uno stacco fa sembrare tutto la stessa cosa, ed è
    // esattamente la distinzione che qui bisogna vedere prima di scegliere.
    h += '<div class="search-results">';
    if (locali.length) {
      h += '<div class="search-group">📗 Nel tuo catalogo<span class="sg-nota">— già in archivio</span></div>';
      h += locali.map(a => rigaRisultato(a)).join('');
    }
    if (off.length) {
      h += '<div class="search-group">🌐 Trovati in rete<span class="sg-nota">— entrano in catalogo quando li scegli</span></div>';
      h += off.map((a, i) => rigaRisultato(a, i)).join('');
    }
    if (!locali.length && !off.length) h += `<div class="search-note">${stato === 'cerco' ? 'Cerco…' : 'Niente trovato. Puoi scriverlo a mano.'}</div>`;
    h += '</div>';
    if (stato) h += `<div class="search-note">${esc(stato === 'cerco' ? '🔎 Cerco su Open Food Facts…' : stato)}</div>`;
    h += `<div class="mt-8"><button class="btn btn-outline btn-sm" data-action="nuovo-alimento" data-nome="${esc(q)}">✏️ Scrivilo a mano</button></div>`;
  }
  setHtml('add-results', h);
}

// Una riga di risultato. `indiceOff` distingue i prodotti appena arrivati dalla rete (che non
// hanno ancora un id nostro) da quelli già in archivio — ed è la stessa cosa che l'icona in testa
// alla riga dice a chi guarda.
function rigaRisultato(a, indiceOff) {
  const attr = indiceOff == null ? `data-food-id="${a.id}"` : `data-off="${indiceOff}"`;
  const f = fonteDi(a, indiceOff != null);
  return `<button class="search-row" data-action="scegli" ${attr}>
    ${iconaFonte(f)}
    <span class="grow">
      <span class="fw-600">${esc(a.name)}</span>
      ${a.brand ? '<span class="text-muted text-xs"> · ' + esc(a.brand) + '</span>' : ''}
      <span class="food-sub riga-fonte">${badgeFonte(f)}<span>${fmtKcal(a.kcal_100g)} kcal/100 g</span></span>
    </span>
    ${indiceOff == null && a.favorite ? '<span>⭐</span>' : ''}
  </button>`;
}

// La ricerca locale è immediata; quella in rete aspetta la pausa di digitazione, perché Open
// Food Facts limita le ricerche testuali a una decina al minuto e cercare a ogni tasto premuto
// fa bandire l'indirizzo IP.
function cercaAlimento(q) {
  S.ricerca.q = q;
  const ql = q.trim().toLowerCase();
  S.ricerca.locali = ql
    ? S.foods.filter(f => (f.name || '').toLowerCase().includes(ql) || (f.brand || '').toLowerCase().includes(ql)).slice(0, 12)
    : [];
  S.ricerca.off = [];
  S.ricerca.stato = ql.length >= 3 ? 'cerco' : '';
  renderRisultati();

  clearTimeout(window._timerRicerca);
  if (ql.length < 3) return;
  window._timerRicerca = setTimeout(async () => {
    try {
      const d = await cercaOnline({ q: ql });
      if (S.ricerca.q.trim().toLowerCase() !== ql) return;   // nel frattempo si è scritto altro
      // Un prodotto già in archivio non si ripropone come risultato di rete: sarebbe la stessa
      // cosa due volte, una delle quali senza id.
      const noti = new Set(S.foods.map(f => f.barcode).filter(Boolean));
      S.ricerca.off = d.alimenti.filter(a => !a.barcode || !noti.has(a.barcode)).slice(0, 15);
      S.ricerca.stato = S.ricerca.off.length ? '' : (riassumiEsiti(d.esiti) || 'Nessun risultato in rete.');
    } catch (err) {
      S.ricerca.off = [];
      S.ricerca.stato = 'La ricerca non ha funzionato: ' + err.message;
    }
    renderRisultati();
  }, RITARDO_RICERCA);
}

/* ── La porzione ───────────────────────────────────────────────
   ⚠️ `default_grams` — la porzione abituale, un uovo 55 g, una pizza 300 g, un cucchiaio d'olio
   10 g — c'è nel catalogo da sempre, e questa finestra ci si apriva sopra IN SILENZIO: il campo
   arrivava già scritto «55» e niente diceva che quei 55 g sono un uovo. Un numero che compare da
   solo si legge come un valore di ripiego, quindi lo si riscriveva a mano ogni volta, che è
   esattamente il lavoro che la colonna esiste per togliere.

   Ora la porzione è scritta e si preme. I tre tagli sono ½, 1 e 2 perché sono quelli che si
   usano davvero — «due uova», «mezza pizza» — e una scaletta di multipli più fitta chiederebbe
   di leggere invece di far scegliere. */
const GRAMMI_RAPIDI = [30, 50, 100, 125, 150, 200, 250];

/* I multipli della porzione di QUESTO alimento. Vuoto se l'alimento non ne ha una: una porzione
   inventata è peggio di nessuna porzione — chi la vede scritta le crede, e sono le calorie della
   giornata.

   ⚠️ Singolare e plurale sono due colonne (`portion_label`, `portion_label_plural`) e non una
   parola sola declinata qui: in italiano il plurale non si ricava a regola proprio dove serve di
   più — uovo → uova — e una parola sbagliata a schermo si legge come un difetto dell'app.
   Il plurale è facoltativo e ripiega sul singolare (per «bresaola» non serve), e senza nessuna
   etichetta si torna a «porzione / porzioni», che è vero per qualunque cosa.

   ⚠️ Il mezzo si scrive «½» e non «mezzo/mezza»: il simbolo non ha genere, quindi vale per
   l'uovo come per la pizza senza dover archiviare anche quello. */
function etichettaPorzione(alimento, plurale) {
  const uno = (alimento && alimento.portion_label || '').trim();
  if (!uno) return plurale ? 'porzioni' : 'porzione';
  if (!plurale) return uno;
  return (alimento.portion_label_plural || '').trim() || uno;
}

function porzioniDi(alimento) {
  const p = num(alimento && alimento.default_grams);
  if (p == null || p <= 0) return [];
  const uno = etichettaPorzione(alimento, false), tanti = etichettaPorzione(alimento, true);
  return [
    { etichetta: '½ ' + uno, g: Math.round(p / 2) },
    { etichetta: '1 ' + uno, g: Math.round(p) },
    { etichetta: '2 ' + tanti, g: Math.round(p * 2) },
  ].filter(v => v.g >= 1);
}

function openPorzione(alimento, meal, foodId) {
  const porz = porzioniDi(alimento);
  const g = porz.length ? porz[1].g : 100;
  // ⚠️ La scaletta fissa si toglie i valori che le porzioni già coprono: due pulsanti «50 g» uno
  // accanto all'altro sembrano due scelte diverse e non lo sono.
  const rapidi = GRAMMI_RAPIDI.filter(v => !porz.some(x => x.g === v));
  const dallaRete = !foodId;
  const fonte = fonteDi(alimento, dallaRete);
  const entraInCatalogo = dallaRete && FONTI_SALVABILI.includes(alimento.source);
  openModal('Quanto ne hai mangiato?', `
    <div class="mb-16">
      <div class="fw-700 hstack gap-6" style="align-items:flex-start">${iconaFonte(fonte)}<span>${esc(alimento.name)}</span></div>
      ${alimento.brand ? '<div class="text-sm text-muted">' + esc(alimento.brand) + '</div>' : ''}
      <div class="riga-fonte mt-4">${badgeFonte(fonte)}<span class="text-sm text-muted">${fmtKcal(alimento.kcal_100g)} kcal per 100 g${alimento.quantita ? ' · confezione ' + esc(alimento.quantita) : ''}</span></div>
      ${!dallaRete ? '' : entraInCatalogo
        ? '<div class="text-xs text-muted mt-4">Non è ancora fra i tuoi alimenti: lo aggiungo al catalogo insieme alla riga del diario, così la prossima volta è già qui.</div>'
        : '<div class="text-xs text-muted mt-4">I valori restano su questa riga del diario, ma il prodotto non entra nel catalogo: dovrai ricercarlo la prossima volta.</div>'}
    </div>
    <div class="form-group">
      <label class="form-label" for="por-g">Peso (grammi)</label>
      <div class="hstack gap-8">
        <input type="number" class="form-input grow" id="por-g" step="1" min="1" max="5000" value="${g}" />
        <button class="btn btn-outline btn-sm" data-action="azzera-grammi" title="Azzera il peso">↺</button>
      </div>
      ${porz.length ? `
        <div class="form-hint">Porzione abituale: <strong>${esc(porz[1].etichetta)}</strong> · ${fmtG(porz[1].g)} g — il campo parte da lì.
          Ogni pulsante <strong>si somma</strong> a quel che c'è scritto; ↺ azzera.</div>
        <div class="hstack gap-6 wrap mt-8">
          ${porz.map(v => `<button class="btn btn-porz btn-sm" data-action="grammi" data-g="${v.g}">${v.etichetta} · ${fmtG(v.g)} g</button>`).join('')}
        </div>
        <div class="form-hint mt-8">Oppure a peso:</div>` : `
        <div class="form-hint">Per questo alimento non è scritta nessuna porzione abituale: parto da 100 g.
          La si scrive una volta sola da 🍎 Alimenti → ✏️, e da lì in poi la trovi qui.
          Ogni pulsante <strong>si somma</strong> a quel che c'è scritto; ↺ azzera.</div>`}
      <div class="hstack gap-6 wrap mt-8">
        ${rapidi.map(v => `<button class="btn btn-outline btn-sm" data-action="grammi" data-g="${v}">${v} g</button>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="por-meal">Pasto</label>
      <select class="form-input form-select" id="por-meal">
        ${opzioniPasto(meal)}
      </select>
    </div>
    <div class="note-box" id="por-anteprima"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-action="close-modal">Annulla</button>
      <button class="btn btn-primary" data-action="conferma-porzione">➕ Aggiungi</button>
    </div>
  `);
  window._porzione = { alimento, foodId: foodId || null };
  aggiornaAnteprimaPorzione();
  setTimeout(() => { const i = $('por-g'); if (i) { i.focus(); i.select(); } }, 50);
}

function aggiornaAnteprimaPorzione() {
  const p = window._porzione;
  const el = $('por-anteprima');
  if (!p || !el) return;
  const g = parseFloat($('por-g')?.value) || 0;
  const q = c => (num(p.alimento[c]) == null ? null : +p.alimento[c] * g / 100);
  el.innerHTML = `<strong>${fmtKcal(q('kcal_100g'))} kcal</strong> per ${fmtG(g)} g`
    + ` · grassi ${fmtG(q('fat_100g'))} g · zuccheri ${fmtG(q('sugars_100g'))} g · proteine ${fmtG(q('proteins_100g'))} g`;
  // Quale pulsante corrisponde a quel che c'è scritto nel campo. Si aggiorna anche scrivendo a
  // mano: la traccia deve seguire il valore, non il tocco, o dopo una correzione a tastiera
  // resterebbe accesa una porzione che non è più quella.
  document.querySelectorAll('[data-action="grammi"]').forEach(b => {
    b.classList.toggle('chip-attivo', parseFloat(b.dataset.g) === g);
  });
}

/* ── Per 100 g o per una porzione? ─────────────────────────────
   ⚠️ In `al_foods` i valori stanno SEMPRE per 100 g, e questa scelta non cambia dove finiscono:
   cambia solo come si leggono quelli che si scrivono qui, e la conversione si fa una volta sola,
   al salvataggio. Non è un secondo modo di archiviare — una colonna «unità» sulla riga vorrebbe
   dire che ogni conto della pagina (il diario, il target, il grafico, la Edge Function) deve
   ricordarsi di guardarla, e il giorno che uno se ne dimentica il totale è sbagliato senza che
   compaia nessun errore. Per 100 g è anche come li scrivono l'etichetta europea e le tabelle di
   composizione, quindi un numero è già la sua percentuale in peso.

   Serve perché molte etichette danno i valori **per confezione o per porzione**, e ricopiarli
   dividendo a mente è il modo migliore per sbagliare: la «Pizza condita» stava in archivio a
   1225 kcal per 100 g — impossibile, il grasso puro ne fa 899 — perché quei numeri erano
   dell'intera pizza, e nessuno se n'era accorto perché la riga sembrava una riga qualunque.

   ⚠️ La scelta parte SEMPRE da «100 g», anche riaprendo un alimento salvato: è quel che c'è
   davvero in archivio. Ricordarla sulla riga la farebbe riaprire su «porzione» e un salvataggio
   senza toccare niente dividerebbe i valori una seconda volta. */
/* Il tetto fisico: 100 g di grasso puro fanno 899 kcal, quindi non c'è niente al mondo che stia
   sopra. Non è un vincolo di gusto ed è per questo che si può controllare — un valore più alto è
   un errore di unità, non un alimento insolito. */
const KCAL_IMPOSSIBILI = 900;

function unitaValori() { return (window._formAlimento || {}).unita || '100'; }

function grammiPorzioneForm() {
  const g = parseFloat($('f-porz')?.value);
  return (!g || isNaN(g) || g <= 0) ? null : g;
}

// Per quanto va moltiplicato ciò che è scritto nelle caselle per averlo per 100 g.
// `null` = non si può convertire, perché manca il divisore.
function fattorePer100() {
  if (unitaValori() !== 'porzione') return 1;
  const g = grammiPorzioneForm();
  return g ? 100 / g : null;
}

/* Ridisegna i due pulsanti e l'anteprima. ⚠️ Non ridisegna il resto della finestra: sostituire le
   caselle mentre uno ci sta scrivendo dentro gli toglie il cursore da sotto le dita. */
function aggiornaUnitaAlimento() {
  const box = $('f-unita');
  if (!box) return;
  const u = unitaValori(), g = grammiPorzioneForm();
  const nome = etichettaPorzione({
    portion_label: ($('f-porz-nome')?.value || '').trim(),
    portion_label_plural: ($('f-porz-nome-pl')?.value || '').trim(),
  }, false);
  box.innerHTML = [
    { u: '100', testo: '100 g' },
    { u: 'porzione', testo: g ? `1 ${nome} · ${fmtG(g)} g` : `1 ${nome}` },
  ].map(b => `<button class="btn btn-sm ${u === b.u ? 'btn-primary' : 'btn-outline'}"
      data-action="unita-valori" data-u="${b.u}"${b.u === 'porzione' && !g ? ' disabled' : ''}>${esc(b.testo)}</button>`).join('');

  const nota = $('f-unita-nota');
  if (nota) {
    nota.innerHTML = u !== 'porzione'
      ? 'Come sull\'etichetta europea e sulle tabelle di composizione.'
      : (g ? `Li divido io: quel che scrivi vale per ${fmtG(g)} g, in archivio va il corrispondente per 100 g.`
           : '⚠️ Scrivi prima <strong>quanti grammi</strong> è una porzione, qui sopra: senza non c\'è niente per cui dividere.');
  }
  aggiornaAnteprimaAlimento();
}

/* ⚠️ L'anteprima esiste perché la scelta è una DICHIARAZIONE sui numeri, non una trasformazione:
   le caselle restano come sono e cambia solo come verranno letti. Senza vedere il risultato, un
   tocco per sbaglio su «1 porzione» dividerebbe valori già giusti, e il difetto si scoprirebbe
   settimane dopo guardando un totale che non torna — cioè lo stesso modo in cui la pizza a 1225
   kcal è passata inosservata. Con «100 g» non si mostra niente: ripeterebbe le caselle. */
function aggiornaAnteprimaAlimento() {
  const el = $('f-anteprima');
  if (!el) return;
  const fattore = fattorePer100();
  if (unitaValori() !== 'porzione' || fattore == null) { el.style.display = 'none'; return; }
  el.style.display = '';
  const q = id => { const n = parseFloat($(id)?.value); return isNaN(n) ? null : n * fattore; };
  const kcal = q('f-kcal');
  el.innerHTML = `In archivio: <strong>${fmtKcal(kcal)} kcal</strong> per 100 g`
    + ` · proteine ${fmtG(q('f-prot'))} g · grassi ${fmtG(q('f-fat'))} g · carboidrati ${fmtG(q('f-carb'))} g`
    + (kcal != null && kcal > KCAL_IMPOSSIBILI
        ? `<div class="text-xs mt-4" style="color:var(--c-danger)">⚠️ ${fmtKcal(kcal)} kcal per 100 g non esistono:
             nemmeno il grasso puro ci arriva (899). Controlla i grammi della porzione.</div>` : '');
}

/* ── Alimento scritto a mano / modifica ───────────────────────── */
function openFormAlimento(f) {
  const v = f || {};
  window._formAlimento = { unita: '100' };
  openModal(f ? 'Modifica alimento' : 'Nuovo alimento', `
    <div class="form-row-2">
      <div class="form-group"><label class="form-label" for="f-name">Nome</label>
        <input class="form-input" id="f-name" value="${esc(v.name || '')}" placeholder="Pasta al pomodoro" /></div>
      <div class="form-group"><label class="form-label" for="f-brand">Marca <span class="text-muted text-xs">(facoltativa)</span></label>
        <input class="form-input" id="f-brand" value="${esc(v.brand || '')}" /></div>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label class="form-label" for="f-porz">Porzione abituale (g)</label>
        <input type="number" class="form-input" id="f-porz" step="1" min="0" value="${v.default_grams ?? ''}" /></div>
      <div class="form-group"><label class="form-label" for="f-porz-nome">Si chiama…</label>
        <input class="form-input" id="f-porz-nome" value="${esc(v.portion_label || '')}" placeholder="uovo, fetta, cucchiaio…" /></div>
      <div class="form-group"><label class="form-label" for="f-porz-nome-pl">…al plurale</label>
        <input class="form-input" id="f-porz-nome-pl" value="${esc(v.portion_label_plural || '')}" placeholder="uova, fette, cucchiai…" /></div>
    </div>
    <div class="form-hint">I nomi fanno leggere «1 uovo · 55 g» invece di «1 porzione · 55 g» quando segni
      quel che mangi. Lasciandoli vuoti si legge «porzione», che va bene per quasi tutto.
      ⚠️ Il plurale si scrive perché l'italiano non lo ricava a regola: <em>uovo</em> fa <em>uova</em>.</div>

function leggiFormAlimento() {
  const v = id => { const el = $(id); const n = el && el.value !== '' ? parseFloat(el.value) : null; return (n == null || isNaN(n)) ? null : n; };
  const t = id => (($(id)?.value) || '').trim() || null;
  const name = ($('f-name')?.value || '').trim();
  if (!name) { alert('Serve un nome.'); return null; }

  const fattore = fattorePer100();
  if (fattore == null) {
    alert('Hai detto che i valori sono di una porzione, ma non hai scritto quanti grammi è.\nScrivilo in «Porzione abituale (g)».');
    return null;
  }
  // ⚠️ Una casella vuota resta vuota anche qui: `null` non si converte, o «non lo so»
  // diventerebbe uno zero — la stessa regola delle caselle vuote, un passaggio più in là.
  const per100 = id => { const n = v(id); return n == null ? null : Math.round(n * fattore * 100) / 100; };

  const kcal = per100('f-kcal');
  if (kcal == null) { alert('Servono almeno le calorie: senza, la riga non conterebbe niente.'); return null; }
  if (kcal > KCAL_IMPOSSIBILI &&
      !confirm(`${kcal} kcal per 100 g non esistono: nemmeno il grasso puro ci arriva (899).\n\n`
             + 'Di solito vuol dire che i valori sono di una porzione o della confezione: scegli '
             + '«1 porzione» qui sopra e scrivi quanti grammi è.\n\nSalvo lo stesso?')) return null;

  return {
    name, brand: ($('f-brand')?.value || '').trim() || null,
    kcal_100g: kcal, proteins_100g: per100('f-prot'), fat_100g: per100('f-fat'), sat_fat_100g: per100('f-sat'),
    carbs_100g: per100('f-carb'), sugars_100g: per100('f-sug'), fiber_100g: per100('f-fib'), salt_100g: per100('f-salt'),
    // ⚠️ I grammi della porzione NON si convertono: sono il divisore, non un valore nutrizionale.
    default_grams: v('f-porz'),
    // ⚠️ Il plurale senza il singolare non si archivia: da solo non comparirebbe mai a schermo
    // (il ½ e l'1 leggono il singolare) e resterebbe una casella scritta che non fa niente.
    portion_label: t('f-porz-nome'),
    portion_label_plural: t('f-porz-nome') ? t('f-porz-nome-pl') : null,
  };
}

/* ⚠️ Un CSV va letto diversamente da un xlsx, per due ragioni che si vedono solo dopo.

   Il SEPARATORE: le tabelle italiane escono col punto e virgola, perché la virgola lì è il
   decimale. Dando per scontata la virgola, ogni riga finisce in una cella sola — e le colonne
   non si riconoscono più, che è esattamente il modo in cui questo import è fallito la prima
   volta. Si conta quale dei tre candidati compare più spesso nelle prime righe.

   La CODIFICA: UTF-8 in modo severo, e al primo carattere che non torna si ripiega su
   Windows-1252 — in cui i fogli italiani sono scritti da sempre. Storpiare gli accenti qui
   vuol dire «Fagiòli» in catalogo per sempre. */
function leggiCsv(XLSX, buf) {
  let testo;
  try { testo = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { testo = new TextDecoder('windows-1252').decode(buf); }
  const prime = testo.split(/\r?\n/).slice(0, 20).join('\n');
  const conta = sep => (prime.split(sep).length - 1);
  const FS = [';', '\t', ','].reduce((a, b) => (conta(b) > conta(a) ? b : a), ';');
  return XLSX.read(testo, { type: 'string', raw: true, FS });
}

async function leggiFileTabella(file) {
  setHtml('imp-esito', '<div class="search-note">Leggo il foglio…</div>');
  try {
    const XLSX = await caricaXLSX();
    const buf = await file.arrayBuffer();
    // ⚠️ `raw: true` e niente conversione: leggendo un CSV all'americana «12,5» diventerebbe 125.
    // I numeri li interpreta numeroTabella(), che riconosce la notazione dall'ultimo separatore.
    const wb = /\.(csv|txt)$/i.test(file.name) ? leggiCsv(XLSX, buf) : XLSX.read(buf, { type: 'array', raw: true });
    let best = null, righe = null, foglio = null;
    for (const nome of wb.SheetNames) {
      const r = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' });
      const m = mappaColonne(r);
      if (m && (!best || m.quante > best.quante)) { best = m; righe = r; foglio = nome; }
    }
    if (!best) {
      setHtml('imp-esito', `<div class="note-box is-danger">Non ho riconosciuto le colonne. Serve almeno
        una colonna col <strong>nome dell'alimento</strong> e una con l'<strong>energia</strong> (kcal o kJ).
        Mandami il file e aggiungo i nomi che usa.</div>`);
      return;
    }
    const voci = leggiTabella(righe, best);
    const noti = new Set(S.foods.map(f => (f.name || '').toLowerCase()));
    const nuove = voci.filter(v => !noti.has(v.name.toLowerCase()));
    window._importTabella = nuove;

    const trovate = COLONNE_TABELLA.filter(c => best.mappa[c.campo] != null && !c.campo.startsWith('_'));
    const derivate = COLONNE_TABELLA.filter(c => best.mappa[c.campo] != null && c.campo.startsWith('_'));
    const mancanti = COLONNE_TABELLA.filter(c => best.mappa[c.campo] == null && !c.campo.startsWith('_'));

    setHtml('imp-esito', `
      <div class="note-box">Foglio <strong>${esc(foglio)}</strong>, intestazioni alla riga ${best.riga + 1}.
        Lette <strong>${voci.length}</strong> voci${voci.length !== nuove.length
          ? `, di cui ${voci.length - nuove.length} già in catalogo (si saltano)` : ''}.</div>
      <div class="mt-12 text-sm"><strong>Colonne riconosciute:</strong> ${trovate.map(c => esc(c.etichetta)).join(', ') || '—'}
        ${derivate.length ? `<div class="text-xs text-muted mt-4">Ricavate: ${derivate.map(c => esc(c.etichetta)).join(', ')}</div>` : ''}
        ${mancanti.length ? `<div class="text-xs text-muted mt-4">Non trovate (resteranno vuote, non zero):
          ${mancanti.map(c => esc(c.etichetta)).join(', ')}</div>` : ''}
      </div>
      <div class="table-wrap mt-12"><table class="table"><thead><tr>
        <th>Alimento</th><th class="text-right">kcal</th><th class="text-right">Grassi</th>
        <th class="text-right">Zuccheri</th><th class="text-right">Proteine</th>
      </tr></thead><tbody>
        ${nuove.slice(0, 8).map(v => `<tr><td>${esc(v.name)}</td>
          <td class="text-right mono">${fmtKcal(v.kcal_100g)}</td>
          <td class="text-right mono text-muted">${fmtG(v.fat_100g)}</td>
          <td class="text-right mono text-muted">${fmtG(v.sugars_100g)}</td>
          <td class="text-right mono text-muted">${fmtG(v.proteins_100g)}</td></tr>`).join('')}
      </tbody></table></div>
      ${nuove.length > 8 ? `<div class="text-xs text-muted mt-8">…e altre ${nuove.length - 8}.</div>` : ''}
      <div class="modal-footer">
        <button class="btn btn-outline" data-action="close-modal">Annulla</button>
        <button class="btn btn-primary" data-action="conferma-tabella" ${nuove.length ? '' : 'disabled'}>
          ➕ Aggiungi ${nuove.length} ${nuove.length === 1 ? 'alimento' : 'alimenti'}</button>
      </div>`);
  } catch (err) {
    setHtml('imp-esito', `<div class="note-box is-danger">Non sono riuscito a leggere il file: ${esc(err.message)}</div>`);
  }
}

/* ── Lo scanner del codice a barre ─────────────────────────────
   Solo dove il browser ha BarcodeDetector (Chrome e la WebView di Android): altrove il codice si
   scrive a mano. Nessuna libreria dal CDN — un lettore di codici a barre da mezzo megabyte per
   una funzione che non tutti i browser possono usare non vale il peso della pagina. */
let _scanner = null;

async function apriScanner() {
  const wrap = $('scanner-wrap'), video = $('scanner-video');
  if (!wrap || !video) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    wrap.classList.add('open');
    const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    _scanner = { stream, timer: setInterval(async () => {
      try {
        const codici = await detector.detect(video);
        if (codici && codici.length) {
          const codice = codici[0].rawValue;
          fermaScanner();
          await cercaBarcode(codice);
        }
      } catch {}
    }, 400) };
  } catch (err) {
    fermaScanner();
    alert('Non riesco ad aprire la fotocamera: ' + err.message + '\nPuoi scrivere il codice a mano.');
    barcodeAMano();
  }
}

function fermaScanner() {
  if (!_scanner) return;
  clearInterval(_scanner.timer);
  _scanner.stream.getTracks().forEach(t => t.stop());
  _scanner = null;
  $('scanner-wrap')?.classList.remove('open');
  const v = $('scanner-video');
  if (v) v.srcObject = null;
}

function barcodeAMano() {
  const codice = prompt('Codice a barre del prodotto (le 13 cifre sotto le righe):');
  if (codice && codice.trim()) cercaBarcode(codice.trim());
}

/* Il codice a barre porta a due posti diversi a seconda di dove si è partiti: dal diario si
   finisce sulla porzione (si sta segnando quel che si mangia), dal catalogo si mette la voce in
   dispensa e basta. `S.scanPer` dice quale delle due, perché la finestra dello scanner è la
   stessa. */
async function cercaBarcode(codice) {
  const perCatalogo = S.scanPer === 'catalogo';
  S.scanPer = null;
  const mio = S.foods.find(f => f.barcode === codice);
  if (mio) {
    if (perCatalogo) { showToast(`«${mio.name}» è già nel tuo catalogo`); return; }
    openPorzione(mio, $('add-meal')?.value || pastoDellOra(), mio.id);
    return;
  }
  showToast('🔎 Cerco il prodotto…');
  try {
    const d = await cercaOnline({ barcode: codice });
    const a = d.alimenti[0] || null;
    if (!a) {
      alert(`Il codice ${codice} non è su Open Food Facts, o il prodotto non ha i valori nutrizionali.\nPuoi scriverlo a mano.`);
      openFormAlimento(null);
      return;
    }
    if (perCatalogo) {
      // Dal catalogo si archivia subito: è esattamente quel che si è chiesto scansionandolo.
      await salvaAlimentoDiRete(a);
      showToast(`➕ «${a.name}» aggiunto al tuo catalogo`);
      await reload();
      return;
    }
    openPorzione(a, $('add-meal')?.value || pastoDellOra(), null);
  } catch (err) {
    alert('Errore: ' + err.message);
  }
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGAZIONE E DISEGNO
   ═══════════════════════════════════════════════════════════════ */

function navigate(view) {
  S.view = view;
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  $('sidebar').classList.remove('open');
  $('mobile-nav-overlay').classList.remove('open');
  render();
}

function render() {
  if (S.view === 'dashboard') renderDashboard();
  else if (S.view === 'diario') renderDiario();
  else if (S.view === 'alimenti') renderAlimenti();
  else if (S.view === 'impostazioni') renderImpostazioni();
  $('footer-version').textContent = APP_VERSION;
  $('footer-info').textContent = S.objective
    ? `obiettivo: ${S.objective.objective_name || '—'}`
    : 'nessun obiettivo attivo';
}

/* ═══════════════════════════════════════════════════════════════
   EVENTI
   ═══════════════════════════════════════════════════════════════ */

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  try {
    if (action === 'nav') { navigate(btn.dataset.view); }

    else if (action === 'close-modal') { closeModal(); }

    else if (action === 'giorno-prec') {
      // Il fondo si rispetta anche qui e non solo nel disegno: il pulsante spento è un
      // suggerimento, non una garanzia — da tastiera ci si arriva lo stesso.
      const g = piuGiorni(S.day, -1);
      if (g >= primoGiornoDiario()) { S.day = g; render(); }
    }
    else if (action === 'ricopia-ieri') {
      btn.disabled = true;
      const n = await ricopiaDalGiornoPrima(S.day);
      if (!n) { btn.disabled = false; return; }
      showToast(`📋 Ricopiate ${n} ${n === 1 ? 'riga' : 'righe'}`);
      await reload();
    }
    else if (action === 'giorno-succ') { if (S.day < oggiStr()) { S.day = piuGiorni(S.day, 1); render(); } }
    else if (action === 'giorno-oggi') { S.day = oggiStr(); render(); }
    else if (action === 'vai-giorno') { S.day = btn.dataset.day; navigate('diario'); }

    else if (action === 'ricalcola') {
      if (!confirm('Ricalcolare il target di questa giornata sui dati di adesso?\n\nIl valore congelato verrà sostituito: se la giornata è passata, cambia il giudizio già dato.')) return;
      await ricalcolaGiorno(btn.dataset.day);
    }

    else if (action === 'aggiungi') { openAggiungi(btn.dataset.meal || pastoDellOra()); }

    else if (action === 'apri-scanner') { S.scanPer = 'diario'; apriScanner(); }
    else if (action === 'chiudi-scanner') { fermaScanner(); }
    else if (action === 'barcode-a-mano') { S.scanPer = 'diario'; barcodeAMano(); }

    else if (action === 'scegli') {
      const meal = $('add-meal')?.value || pastoDellOra();
      if (btn.dataset.off != null) {
        // L'alimento di rete NON si salva ancora in archivio: si salva insieme alla riga del
        // diario, altrimenti aprire un risultato per sbaglio riempirebbe il catalogo di prodotti
        // mai mangiati.
        openPorzione(S.ricerca.off[+btn.dataset.off], meal, null);
      } else {
        const f = S.foods.find(x => x.id === btn.dataset.foodId);
        if (f) openPorzione(f, meal, f.id);
      }
    }

    /* ⚠️ Il pulsante SOMMA invece di sostituire: tre uova si segnano toccando «1 uovo» tre volte,
       e non c'è un pulsante per ogni quantità che si possa voler mangiare. Sostituendo, toccarlo
       una seconda volta non faceva niente di visibile — sembrava che il tocco non fosse passato.
       Il campo parte comunque dalla porzione abituale, che è il caso di gran lunga più frequente
       e non costa nessun tocco; l'↺ è lì per ricominciare da zero quando si compone. */
    else if (action === 'grammi') {
      const i = $('por-g');
      if (i) {
        const ora = parseFloat(i.value);
        // Un decimale: gli scalini sono interi, ma il campo si può scrivere a mano (12,5 g di
        // olio) e senza l'arrotondamento la somma tirerebbe fuori le code binarie di JavaScript.
        i.value = Math.round(((isNaN(ora) ? 0 : ora) + (parseFloat(btn.dataset.g) || 0)) * 10) / 10;
        aggiornaAnteprimaPorzione();
      }
    }
    else if (action === 'azzera-grammi') {
      const i = $('por-g');
      if (i) { i.value = ''; i.focus(); aggiornaAnteprimaPorzione(); }
    }

    else if (action === 'conferma-porzione') {
      const p = window._porzione;
      const g = parseFloat($('por-g')?.value);
      if (!p || !g || g <= 0) { alert('Scrivi quanti grammi.'); return; }
      const meal = $('por-meal')?.value || pastoDellOra();
      btn.disabled = true;
      let foodId = p.foodId;
      let nuovoInCatalogo = false;
      if (!foodId && FONTI_SALVABILI.includes(p.alimento.source)) {
        // L'alimento preso dalla rete entra nel catalogo ADESSO, insieme alla riga del diario:
        // la prossima volta è già lì e non serve nessuna ricerca.
        const salvato = await salvaAlimentoDiRete(p.alimento);
        foodId = salvato?.id || null;
        nuovoInCatalogo = !!foodId;
      }
      await aggiungiAlDiario({ giorno: S.day, meal, alimento: p.alimento, grammi: g, foodId });
      closeModal();
      showToast(`➕ ${p.alimento.name} · ${fmtKcal(p.alimento.kcal_100g * g / 100)} kcal`
                + (nuovoInCatalogo ? ' · aggiunto al catalogo' : ''));
      await reload();
    }

    else if (action === 'modifica-riga') {
      const r = S.logs.find(x => x.id === btn.dataset.id);
      if (!r) return;
      const g = prompt(`${r.name}\nQuanti grammi?`, r.grams);
      if (g == null) return;
      const n = parseFloat(String(g).replace(',', '.'));
      if (!n || n <= 0) { alert('Grammi non validi.'); return; }
      await sbUpd('al_log', `id=eq.${r.id}`, { grams: n });
      await reload();
    }

    else if (action === 'elimina-riga') {
      const r = S.logs.find(x => x.id === btn.dataset.id);
      if (!r || !confirm(`Togliere «${r.name}» dal diario?`)) return;
      await sbDel('al_log', `id=eq.${r.id}`);
      await reload();
    }

    else if (action === 'nuovo-alimento') {
      closeModal();
      openFormAlimento(btn.dataset.nome ? { name: btn.dataset.nome } : null);
    }
    else if (action === 'unita-valori') {
      window._formAlimento = { unita: btn.dataset.u };
      aggiornaUnitaAlimento();
    }
    else if (action === 'modifica-alimento') {
      openFormAlimento(S.foods.find(f => f.id === btn.dataset.id));
    }
    else if (action === 'salva-alimento') {
      const dati = leggiFormAlimento();
      if (!dati) return;
      if (btn.dataset.id) {
        await sbUpd('al_foods', `id=eq.${btn.dataset.id}`, { ...dati, updated_at: new Date().toISOString() });
      } else {
        await sbIns('al_foods', [{ ...dati, source: 'manuale' }]);
      }
      closeModal();
      showToast('💾 Alimento salvato');
      await reload();
    }
    else if (action === 'elimina-alimento') {
      const f = S.foods.find(x => x.id === btn.dataset.id);
      if (!f) return;
      // Le righe del diario restano: portano i loro valori congelati e `food_id` diventa NULL.
      // Cancellare un alimento non deve riscrivere quel che si è mangiato.
      if (!confirm(`Eliminare «${f.name}» dall'archivio?\n\nLe righe già segnate nel diario restano come sono.`)) return;
      await sbDel('al_foods', `id=eq.${f.id}`);
      await reload();
    }
    else if (action === 'preferito') {
      const f = S.foods.find(x => x.id === btn.dataset.id);
      if (!f) return;
      await sbUpd('al_foods', `id=eq.${f.id}`, { favorite: !f.favorite });
      await reload();
    }

    else if (action === 'salva-profilo') {
      // Solo l'attività: data di nascita, altezza e sesso vivono in cm_profile e da qui non si
      // toccano. al_profile resta per questo campo solo — le sue colonne birth_date, height_cm
      // e sex non vengono più né lette né scritte.
      const body = {
        user_id: uid(),
        activity: parseFloat($('p-activity')?.value) || 1.375,
        updated_at: new Date().toISOString(),
      };
      // Una riga per utente: l'upsert sulla chiave primaria è l'unico modo perché salvare due
      // volte non crei due righe con due fattori diversi.
      await sbIns('al_profile?on_conflict=user_id', [body], { 'Prefer': 'resolution=merge-duplicates,return=representation' });
      showToast('💾 Attività salvata');
      await reload();
    }

    else if (action === 'importa-tabella') { openImportaTabella(); }

    else if (action === 'conferma-tabella') {
      const voci = window._importTabella || [];
      if (!voci.length) return;
      btn.disabled = true;
      // A blocchi: novecento righe in una POST sola è un corpo che PostgREST può rifiutare, e
      // se lo rifiuta non entra niente invece di entrare quasi tutto.
      const BLOCCO = 150;
      let scritte = 0;
      for (let i = 0; i < voci.length; i += BLOCCO) {
        const parte = voci.slice(i, i + BLOCCO).map(v => ({ ...v, source: 'base' }));
        await sbIns('al_foods', parte, { 'Prefer': 'return=minimal' });
        scritte += parte.length;
        setHtml('imp-esito', `<div class="search-note">Scritte ${scritte} di ${voci.length}…</div>`);
      }
      window._importTabella = null;
      closeModal();
      showToast(`📄 ${scritte} alimenti aggiunti al catalogo`);
      await reload();
    }

    else if (action === 'aggiungi-al-catalogo') {
      const a = S.cercaOff.risultati[+btn.dataset.off];
      if (!a) return;
      btn.disabled = true;
      await salvaAlimentoDiRete(a);
      showToast(`➕ «${a.name}» aggiunto al tuo catalogo`);
      // Si toglie dai risultati solo quello aggiunto: gli altri restano, perché da una ricerca
      // sola se ne aggiungono spesso due o tre, e azzerarla costringerebbe a riscriverla ogni
      // volta — con una chiamata in più a Open Food Facts, che le ricerche le conta.
      S.cercaOff.risultati = S.cercaOff.risultati.filter((_, i) => i !== +btn.dataset.off);
      await reload();
    }

    else if (action === 'apri-scanner-cat') { S.scanPer = 'catalogo'; apriScanner(); }
    else if (action === 'barcode-catalogo') { S.scanPer = 'catalogo'; barcodeAMano(); }

    else if (action === 'prova-off') {
      btn.disabled = true;
      setHtml('off-esito', '<div class="search-note">Provo…</div>');
      // ⚠️ Le prove le fa la Edge Function, non il browser: è lei che parla con le banche dati,
      // quindi è il suo esito che conta. Provare da qui direbbe se il browser ci arriva, che
      // non è più la domanda.
      const righe = [];
      for (const [che, richiesta] of [
        ['Codice a barre <span class="text-muted text-xs">(un prodotto notissimo)</span>', { barcode: '3017620422003' }],
        ['Ricerca per nome <span class="text-muted text-xs">(«nutella»)</span>', { q: 'nutella' }],
      ]) {
        const t0 = Date.now();
        try {
          const d = await cercaOnline({ ...richiesta, diagnostica: true });
          righe.push([che, d.alimenti.length
            ? `✅ ${d.alimenti.length} risultati — «${esc(d.alimenti[0].name)}»`
            : '⚠️ nessun risultato', d.esiti, Date.now() - t0]);
        } catch (e) {
          righe.push([che, `❌ ${esc(e.message)}`, [], Date.now() - t0]);
        }
      }
      setHtml('off-esito', `<div class="table-wrap"><table class="table"><tbody>
        ${righe.map(([che, esito, esiti, ms]) => `<tr><td>${che}
          ${esiti.length ? `<div class="text-xs text-muted mt-4">${esc(riassumiEsiti(esiti))}</div>` : ''}</td>
          <td class="text-right nowrap">${esito} <span class="text-muted text-xs">· ${ms} ms</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="note-box mt-12">Le prove le fa la Edge Function <span class="mono">al-food-search</span>,
        che gira sui server di Supabase: è lei a parlare con le banche dati, quindi è il suo esito
        che conta. Sotto ogni riga c'è cosa ha risposto ciascuna fonte. La ricerca vecchia
        (<span class="mono">cgi/search.pl</span>) è deprecata e dà 503 quasi sempre: va bene che
        sia rossa finché quella nuova risponde.</div>`);
      btn.disabled = false;
    }

    else if (action === 'salva-pasti') {
      const scelti = PASTI_BASE
        .filter(b => document.querySelector(`[data-pasto-attivo="${b.id}"]`)?.checked)
        .map(b => ({ id: b.id, label: (document.querySelector(`[data-pasto-nome="${b.id}"]`)?.value || '').trim() || b.label }));
      // Zero pasti non è una configurazione, è un diario in cui non si può segnare niente.
      if (!scelti.length) { alert('Serve almeno un pasto: senza, nel diario non si può segnare niente.'); return; }
      await salvaPasti(scelti);
      showToast(`💾 ${scelti.length} ${scelti.length === 1 ? 'pasto' : 'pasti'} al giorno`);
      await reload();
    }

    else if (action === 'svuota-diario') {
      const q = prompt('Questo cancella TUTTE le righe del diario, per sempre.\nScrivi CANCELLA per confermare:');
      if (q !== 'CANCELLA') return;
      await sbDel('al_log', 'id=not.is.null');
      showToast('🗑 Diario svuotato');
      await reload();
    }
  } catch (err) {
    console.error(err);
    alert('Errore: ' + err.message);
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'add-q') cercaAlimento(el.value);
  else if (el.id === 'por-g') aggiornaAnteprimaPorzione();
  // I grammi e i nomi della porzione rifanno anche i due pulsanti (che li scrivono dentro);
  // le caselle dei valori la sola anteprima.
  else if (['f-porz', 'f-porz-nome', 'f-porz-nome-pl'].includes(el.id)) aggiornaUnitaAlimento();
  else if (/^f-(kcal|prot|fat|sat|carb|sug|fib|salt)$/.test(el.id)) aggiornaAnteprimaAlimento();
  else if (el.matches('[data-action="cerca-alimenti"]')) {
    S.cercaAlimenti = el.value;
    cercaOffCatalogo(el.value);   // la rete si consulta da sé, dopo la pausa di digitazione
    clearTimeout(window._timerAlimenti);
    window._timerAlimenti = setTimeout(() => {
      renderAlimenti();
      const i = document.querySelector('[data-action="cerca-alimenti"]');
      if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    }, 220);
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp-file') { if (el.files?.[0]) leggiFileTabella(el.files[0]); return; }
  if (el.id === 'day-picker') {
    // `min` e `max` sull'input li rispetta il calendario del browser, non chi scrive la data a
    // mano nel campo: la stretta vera si fa qui.
    const g = el.value || oggiStr();
    S.day = g < primoGiornoDiario() ? primoGiornoDiario() : (g > oggiStr() ? oggiStr() : g);
    render();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal-overlay').classList.contains('hidden')) closeModal();
});

$('btn-hamburger').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('mobile-nav-overlay').classList.toggle('open');
});
$('mobile-nav-overlay').addEventListener('click', () => {
  $('sidebar').classList.remove('open');
  $('mobile-nav-overlay').classList.remove('open');
});
$('modal-close').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

/* ═══════════════════════════════════════════════════════════════
   AVVIO
   ═══════════════════════════════════════════════════════════════ */

async function init() {
  S.day = oggiStr();

  let session = null;
  const sbToken = localStorage.getItem('sb_token');
  if (sbToken) session = await initFromSbToken(sbToken);
  if (!session) {
    session = loadSession();
    if (session && session.expires_at < Date.now()) session = await refreshSession(session);
  }
  if (!session) { location.href = '/'; return; }
  S.session = session;

  const _authChannel = new BroadcastChannel('appsphere_auth');
  _authChannel.onmessage = ev => {
    if (!ev.data) return;
    if (ev.data.type === 'LOGOUT') { localStorage.removeItem('sb_token'); location.href = '/'; }
    else if (ev.data.type === 'TOKEN_REFRESH' && ev.data.sbToken) {
      localStorage.setItem('sb_token', ev.data.sbToken);
      if (S.session) S.session.access_token = ev.data.sbToken;
    }
  };

  try {
    await loadData();
  } catch (err) {
    console.error('Errore caricamento dati:', err);
    alert('Errore nel caricamento dei dati: ' + err.message);
  }

  $('screen-app').style.display = 'flex';
  $('loading-overlay').classList.add('hidden');
  navigate('dashboard');

  // I dati anagrafici sono la prima cosa senza la quale non esce nessun numero: se mancano si
  // apre su Impostazioni, dove c'è scritto dove si compilano e il pulsante che ci porta, invece
  // di mostrare un diario di trattini che non si spiega da sé.
  const p = S.profile;
  if (!p.birth_date || !p.height_cm || !SESSI[p.sex]) {
    navigate('impostazioni');
    showToast('👤 Completa il Profilo di AppSphere: senza, il target non si calcola');
  }
}

init();
</script>
